    <!-- CỘT 1: DOANH THU THEO KÊNH (Progress bars) -->
    <g transform="translate(26, 172)">
      <text x="0" y="14" fill="#334155" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.05em">DOANH THU THEO KÊNH</text>

      <!-- Booking.com -->
      <g transform="translate(0, 28)">
        <circle cx="4" cy="9" r="3.5" fill="#2c5270"/>
        <text x="14" y="13" fill="#334155" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="600">Booking.com</text>
        <rect x="85" y="1" width="135" height="15" rx="7.5" fill="#f1f5f9"/>
        <rect x="85" y="1" width="135" height="15" rx="7.5" fill="#2c5270"/>
        <text x="228" y="13" fill="#0f172a" font-family="-apple-system, Roboto, sans-serif" font-size="11.5" font-weight="800">182,4tr</text>
        <text x="228" y="24" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="9" font-weight="500">38%</text>
      </g>

      <!-- Agoda -->
      <g transform="translate(0, 64)">
        <circle cx="4" cy="9" r="3.5" fill="#3b698e"/>
        <text x="14" y="13" fill="#334155" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="600">Agoda</text>
        <rect x="85" y="1" width="135" height="15" rx="7.5" fill="#f1f5f9"/>
        <rect x="85" y="1" width="96" height="15" rx="7.5" fill="#3b698e"/>
        <text x="228" y="13" fill="#0f172a" font-family="-apple-system, Roboto, sans-serif" font-size="11.5" font-weight="800">128,6tr</text>
        <text x="228" y="24" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="9" font-weight="500">26%</text>
      </g>

      <!-- Traveloka -->
      <g transform="translate(0, 100)">
        <circle cx="4" cy="9" r="3.5" fill="#719bbb"/>
        <text x="14" y="13" fill="#334155" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="600">Traveloka</text>
        <rect x="85" y="1" width="135" height="15" rx="7.5" fill="#f1f5f9"/>
        <rect x="85" y="1" width="50" height="15" rx="7.5" fill="#719bbb"/>
        <text x="228" y="13" fill="#0f172a" font-family="-apple-system, Roboto, sans-serif" font-size="11.5" font-weight="800">66,8tr</text>
        <text x="228" y="24" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="9" font-weight="500">14%</text>
