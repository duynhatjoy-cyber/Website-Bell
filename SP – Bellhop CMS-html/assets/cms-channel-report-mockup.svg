        <text x="0" y="10" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="9.5" font-weight="600">Kênh</text>
        <text x="88" y="10" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="9.5" font-weight="600">Đặt phòng</text>
        <text x="140" y="10" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="9.5" font-weight="600">Hoa hồng</text>
        <text x="210" y="10" fill="#94a3b8" font-family="-apple-system, Roboto, sans-serif" font-size="9.5" font-weight="600">Tỷ lệ hủy</text>
      </g>

      <!-- Hàng 1: Booking.com -->
      <g transform="translate(0, 48)">
        <rect x="0" y="3" width="7" height="7" rx="1.5" fill="#2c5270"/>
        <text x="14" y="10" fill="#1e293b" font-family="-apple-system, Roboto, sans-serif" font-size="10.5" font-weight="600">Booking.com</text>
        <text x="96" y="10" fill="#334155" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="600">118</text>
        <text x="144" y="10" fill="#334155" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="600">27,4tr</text>
