      <!-- Website -->
      <g transform="translate(0, 136)">
        <circle cx="4" cy="9" r="3.5" fill="#2ba397"/>
        <text x="14" y="13" fill="#334155" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="700">Website</text>
