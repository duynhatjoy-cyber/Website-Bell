<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <filter id="dashShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0e2338" flood-opacity="0.12"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#0b1727" flood-opacity="0.22"/>
    </filter>
    <filter id="pillShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0e2338" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- 1. DASHBOARD CHÍNH BÊN TRÁI -->
  <g transform="translate(30, 25)" filter="url(#dashShadow)">
    <!-- Thân bảng trắng -->
    <rect width="600" height="375" rx="22" fill="#ffffff" stroke="#e6edf3" stroke-width="1.5"/>

    <!-- Header Dashboard -->
    <text x="28" y="42" fill="#0f172a" font-family="-apple-system, Roboto, sans-serif" font-size="18" font-weight="800">Báo cáo theo kênh</text>
    <text x="28" y="60" fill="#64748b" font-family="-apple-system, Roboto, sans-serif" font-size="11.5" font-weight="500">Tháng 10/2026 · Khách sạn Mẫu</text>

    <!-- Time Range Tabs -->
    <g transform="translate(435, 26)">
      <rect width="135" height="30" rx="15" fill="#f1f5f9"/>
      <text x="24" y="20" fill="#64748b" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tuần</text>
      <!-- Active Tab Tháng -->
      <rect x="46" y="2" width="46" height="26" rx="13" fill="#0f172a"/>
      <text x="69" y="19" fill="#ffffff" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Tháng</text>
      <text x="114" y="20" fill="#64748b" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Quý</text>
    </g>

    <!-- 3 Mini Stats Cards -->
    <!-- Card 1: Tổng đặt phòng -->
    <g transform="translate(26, 76)">
      <rect width="170" height="74" rx="12" fill="#f8fafc" stroke="#edf2f7" stroke-width="1"/>
      <text x="16" y="24" fill="#64748b" font-family="-apple-system, Roboto, sans-serif" font-size="11.5" font-weight="600">Tổng đặt phòng</text>
      <text x="16" y="52" fill="#0f172a" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="900">312</text>
      <rect x="68" y="38" width="94" height="18" rx="9" fill="#ecfdf5"/>
      <text x="115" y="51" fill="#059669" font-family="-apple-system, Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">▲ 12% so tháng 9</text>
    </g>

    <!-- Card 2: Doanh thu phòng -->
    <g transform="translate(210, 76)">
      <rect width="175" height="74" rx="12" fill="#f8fafc" stroke="#edf2f7" stroke-width="1"/>
      <text x="16" y="24" fill="#64748b" font-family="-apple-system, Roboto, sans-serif" font-size="11.5" font-weight="600">Doanh thu phòng</text>
      <text x="16" y="52" fill="#0f172a" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="900">486,2tr</text>
      <rect x="115" y="38" width="48" height="18" rx="9" fill="#ecfdf5"/>
      <text x="139" y="51" fill="#059669" font-family="-apple-system, Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">▲ 9%</text>
    </g>

    <!-- Card 3: Hoa hồng OTA -->
    <g transform="translate(398, 76)">
      <rect width="176" height="74" rx="12" fill="#f8fafc" stroke="#edf2f7" stroke-width="1"/>
      <text x="16" y="24" fill="#64748b" font-family="-apple-system, Roboto, sans-serif" font-size="11.5" font-weight="600">Hoa hồng OTA</text>
      <text x="16" y="52" fill="#0f172a" font-family="-apple-system, Roboto, sans-serif" font-size="24" font-weight="900">59,2tr</text>
      <rect x="96" y="38" width="70" height="18" rx="9" fill="#fef3c7"/>
      <text x="131" y="51" fill="#d97706" font-family="-apple-system, Roboto, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">12% d.thu</text>
