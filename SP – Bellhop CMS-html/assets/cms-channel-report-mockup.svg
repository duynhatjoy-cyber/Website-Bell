    </g>

    <!-- CỘT 2: BẢNG CHI TIẾT -->
    <g transform="translate(305, 172)">
      <text x="0" y="14" fill="#334155" font-family="-apple-system, Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="0.05em">CHI TIẾT</text>
      
