<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bellhop – Bảng giá FAQ</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./assets/81e26d43a82c22dd79010c853e0d4ffa.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="bh {{markCls}}" style="background: transparent">
<div class="split-48">
  <div class="stack" style="gap: 20px">
    <span class="eyebrow" style="color: #1f7a84">FAQ BẢNG GIÁ</span>
    <h2 class="h2">{{title}}</h2>
    <div class="stack" style="gap: 14px; margin-top: 12px; padding: 24px; border-radius: 18px; background: #fff; border: 1px solid #dde4ec">
      <div class="row" style="gap: 12px"><span class="ic ic-tile-sm i-headset"></span><b style="color: #122745">Cần tư vấn gói cước phù hợp?</b></div>
      <p class="small muted">Chuyên viên tư vấn Bellhop sẽ tính toán phương án chi phí tối ưu nhất cho quy mô cơ sở của bạn.</p>
      <div class="btns"><a class="btn btn-sm" href="https://zalo.me" target="_blank" rel="noopener" style="background: #0068ff; color: #fff">Chat Zalo</a><a class="btn btn-sm btn-outline" href="#form">Nhận báo giá</a></div>
    </div>
  </div>
  <div class="faq">
    <sc-for list="{{rows}}" as="it" hint-placeholder-count="6">
    <div class="faq-i {{it.cls}}">
      <button class="faq-q" aria-expanded="{{it.exp}}" onClick="{{it.toggle}}"><span>{{it.q}}</span><span class="pm" aria-hidden="true"></span></button>
      <sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
        <div class="faq-a">{{it.a}}</div>
      </sc-if>
    </div>
    </sc-for>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Câu hỏi thường gặp về Bảng giá"},"marks":{"editor":"boolean","default":true},"items":{"editor":null},"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: 0 }; }
  renderVals() {
    const items = this.props.items || [
      { q: 'Chi phí tính theo phòng được tính như thế nào? Khách sạn dưới 10 phòng tính sao?', a: 'Chi phí được tính dựa trên số lượng phòng vật lý thực tế của khách sạn. Đối với các cơ sở lưu trú dưới 10 phòng, hệ thống áp dụng mức tính sàn tối thiểu là 10 phòng để đảm bảo chất lượng hạ tầng và dịch vụ hỗ trợ kỹ thuật tốt nhất.' },
      { q: 'Tôi có phải trả phí cài đặt ban đầu hoặc phí nâng cấp tính năng mới không?', a: 'Hoàn toàn không. Bellhop không thu phí cài đặt ban đầu, không thu phí duy trì máy chủ và miễn phí 100% tất cả các bản cập nhật tính năng mới trong suốt thời gian sử dụng phần mềm.' },
      { q: 'Tôi có thể dùng thử trước khi trả phí không?', a: 'Có. Bạn có thể sử dụng Gói Miễn Phí trọn đời cho các nghiệp vụ lễ tân cơ bản, hoặc đăng ký trải nghiệm miễn phí 7 ngày đầy đủ tính năng kết nối OTA của Gói Nâng Cao trước khi quyết định ký hợp đồng.' },
      { q: 'Khi muốn nâng cấp hoặc chuyển đổi giữa các gói cước thì tính phí thế nào?', a: 'Khách sạn có thể nâng cấp gói bất kỳ lúc nào. Số tiền chưa sử dụng của gói cũ sẽ được hệ thống tự động quy đổi và trừ trực tiếp vào chi phí của gói mới.' },
      { q: 'Bellhop có hỗ trợ chuyển dữ liệu từ phần mềm cũ sang không?', a: 'Có. Đội ngũ chuyên viên kỹ thuật của Bellhop sẽ đồng hành hỗ trợ nhập danh sách hạng phòng, danh mục dịch vụ, danh sách khách hàng và các đặt phòng hiện có từ phần mềm cũ sang Bellhop hoàn toàn miễn phí.' },
      { q: 'Dữ liệu của khách sạn được lưu trữ và bảo mật thế nào?', a: 'Toàn bộ dữ liệu được lưu trữ trên nền tảng đám mây bảo mật cao cấp, tự động sao lưu dự phòng hàng ngày và mã hóa đường truyền theo tiêu chuẩn SSL quốc tế, đảm bảo an toàn tuyệt đối ngay cả khi mất điện hay hỏng thiết bị tại quầy.' }
    ];
    const o = this.state.open;
    const marks = this.props.marks ?? true;
    return {
      markCls: marks ? '' : 'no-marks',
      title: this.props.title ?? 'Câu hỏi thường gặp về Bảng giá',
      rows: items.map((it, i) => ({
        q: it.q, a: it.a,
        open: o === i, cls: o === i ? 'open' : '', exp: o === i ? 'true' : 'false',
        toggle: () => this.setState({ open: this.state.open === i ? -1 : i })
      }))
    };
  }
}
</script>
</body>
</html>
