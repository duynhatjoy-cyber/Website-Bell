    <text x="56" y="111" font-family="Roboto, sans-serif" font-size="10" fill="#fff" font-weight="700">TH</text>
    <text x="86" y="99" font-family="Roboto, sans-serif" font-size="12" fill="#122745" font-weight="700">Thu Hà</text>
    <text x="180" y="99" font-family="Roboto, sans-serif" font-size="10" fill="#64748b">09:12</text>
    <text x="86" y="117" font-family="Roboto, sans-serif" font-size="11" fill="#64748b">Còn phòng đôi thứ 7 không...</text>

    <rect x="38" y="144" width="204" height="54" rx="8" fill="#ffffff"/>
    <circle cx="62" cy="171" r="14" fill="#1877f2"/>
    <text x="56" y="175" font-family="Roboto, sans-serif" font-size="10" fill="#fff" font-weight="700">JK</text>
    <text x="86" y="163" font-family="Roboto, sans-serif" font-size="12" fill="#122745" font-weight="700">Jun Kim</text>
    <text x="180" y="163" font-family="Roboto, sans-serif" font-size="10" fill="#64748b">09:05</text>
    <text x="86" y="181" font-family="Roboto, sans-serif" font-size="11" fill="#64748b">Is breakfast included?</text>

    <rect x="38" y="206" width="204" height="54" rx="8" fill="#ffffff"/>
    <circle cx="62" cy="233" r="14" fill="#122745"/>
    <text x="55" y="237" font-family="Roboto, sans-serif" font-size="10" fill="#fff" font-weight="700">MP</text>
    <text x="86" y="225" font-family="Roboto, sans-serif" font-size="12" fill="#122745" font-weight="700">Minh Phúc</text>
    <text x="180" y="225" font-family="Roboto, sans-serif" font-size="10" fill="#64748b">08:41</text>
    <text x="86" y="243" font-family="Roboto, sans-serif" font-size="11" fill="#64748b">Cho mình xin địa chỉ</text>

    <!-- Chat Area Header -->
    <rect x="251" y="68" width="379" height="46" fill="#ffffff"/>
    <line x1="251" y1="114" x2="630" y2="114" stroke="#e2e8f0" stroke-width="1"/>
    <text x="272" y="96" font-family="Roboto, sans-serif" font-size="13" fill="#122745" font-weight="700">Thu Hà · Khách Zalo OA</text>
    <rect x="520" y="82" width="90" height="24" rx="6" fill="#eef8f9"/>
    <text x="532" y="98" font-family="Roboto, sans-serif" font-size="11" fill="#1f7a84" font-weight="700">Lễ tân Ngọc</text>

    <!-- Chat Bubbles -->
    <rect x="270" y="136" width="220" height="38" rx="12" fill="#f1f5f9"/>
    <text x="284" y="159" font-family="Roboto, sans-serif" font-size="12" fill="#1e293b">Còn phòng đôi tối thứ 7 không ạ?</text>

    <rect x="320" y="190" width="290" height="52" rx="12" fill="#122745"/>
    <text x="334" y="211" font-family="Roboto, sans-serif" font-size="12" fill="#ffffff">Dạ còn ạ. Phòng Deluxe giường đôi giá</text>
    <text x="334" y="229" font-family="Roboto, sans-serif" font-size="12" fill="#ffffff">890.000đ/đêm, em giữ phòng giúp chị nhé?</text>
