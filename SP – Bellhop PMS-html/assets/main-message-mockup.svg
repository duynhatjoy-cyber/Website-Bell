  <!-- AI Concierge Floating Popup -->
  <g filter="url(#shadow2)">
    <rect x="420" y="230" width="310" height="210" rx="18" fill="#ffffff" stroke="#dde4ec" stroke-width="1.5"/>
    <rect x="420" y="230" width="310" height="48" rx="18" fill="#122745"/>
    <rect x="420" y="260" width="310" height="18" fill="#122745"/>
    <circle cx="446" cy="254" r="14" fill="#5fb9c2"/>
    <text x="440" y="258" font-family="Roboto, sans-serif" font-size="11" fill="#122745" font-weight="900">AI</text>
    <text x="470" y="254" font-family="Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="700">Bellhop AI Concierge</text>
    <text x="470" y="268" font-family="Roboto, sans-serif" font-size="10" fill="#a9bbd1">Tự động trả lời 24/7</text>

    <rect x="436" y="294" width="180" height="34" rx="10" fill="#f1f5f9"/>
    <text x="448" y="315" font-family="Roboto, sans-serif" font-size="11" fill="#1e293b">Mấy giờ nhận phòng ạ?</text>

    <rect x="450" y="340" width="260" height="50" rx="10" fill="#eef8f9" stroke="#bfe3e8"/>
    <text x="462" y="360" font-family="Roboto, sans-serif" font-size="11" fill="#1f7a84" font-weight="600">Giờ nhận phòng từ 14:00, trả phòng</text>
    <text x="462" y="377" font-family="Roboto, sans-serif" font-size="11" fill="#1f7a84" font-weight="600">trước 12:00 trưa hôm sau ạ.</text>
  </g>
