<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0b1a30" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Main Inbox Window -->
  <g filter="url(#shadow2)">
    <rect x="30" y="30" width="600" height="390" rx="14" fill="#ffffff" stroke="#dde4ec" stroke-width="1.5"/>
    <rect x="30" y="30" width="600" height="38" rx="14" fill="#f1f4f8"/>
    <rect x="30" y="54" width="600" height="14" fill="#f1f4f8"/>
    <circle cx="52" cy="49" r="5" fill="#ef4444"/>
    <circle cx="68" cy="49" r="5" fill="#f59e0b"/>
    <circle cx="84" cy="49" r="5" fill="#10b981"/>
    <rect x="110" y="39" width="260" height="20" rx="6" fill="#ffffff" stroke="#e0e8ee" stroke-width="1"/>
    <text x="124" y="53" font-family="Roboto, sans-serif" font-size="11" fill="#566579">app.bellhop.vn/hop-thu</text>

    <!-- Split: Left List, Right Chat -->
    <rect x="30" y="68" width="220" height="352" fill="#f8fafc"/>
