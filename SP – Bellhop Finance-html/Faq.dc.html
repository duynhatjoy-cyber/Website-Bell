<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bellhop Finance – FAQ</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./assets/81e26d43a82c22dd79010c853e0d4ffa.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="bh {{markCls}}" style="background: transparent">
<div class="split-48">
  <div class="stack" style="gap: 20px">
    <span class="eyebrow" style="color: #1f6b52">FAQ</span>
    <h2 class="h2">{{title}}</h2>
    <div class="stack" style="gap: 14px; margin-top: 12px; padding: 24px; border-radius: 18px; background: #fff; border: 1px solid #dde4ec">
      <div class="row" style="gap: 12px"><span class="ic ic-tile-sm i-headset"></span><b style="color: #122745">Chưa thấy câu trả lời?</b></div>
      <p class="small muted">Đội ngũ chuyên viên tư vấn tài chính Bellhop luôn sẵn sàng giải đáp và hỗ trợ.</p>
      <div class="btns"><a class="btn btn-sm" href="#" style="background: #0068ff; color: #fff">Chat Zalo</a><a class="btn btn-sm btn-outline" href="#">Gọi tư vấn</a></div>
    </div>
  </div>
  <div class="faq">
    <sc-for list="{{rows}}" as="it" hint-placeholder-count="6">
    <div class="faq-i {{it.cls}}">
      <button class="faq-q" aria-expanded="{{it.exp}}" onClick="{{it.toggle}}"><span>{{it.q}}</span><span class="pm" aria-hidden="true"></span></button>
      <sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
        <div class="faq-a">{{it.a}} <sc-if value="{{it.tbc}}" hint-placeholder-val="{{ false }}"><i class="tbc">Cần xác nhận</i></sc-if></div>
      </sc-if>
    </div>
    </sc-for>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Câu hỏi thường gặp"},"marks":{"editor":"boolean","default":true},"items":{"editor":null},"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: 0 }; }
  renderVals() {
    const items = this.props.items || [
      { q: 'Bellhop Finance hỗ trợ phiên bản MISA nào?', a: 'Bellhop Finance hỗ trợ kết nối trực tiếp với MISA SME và MISA AMIS Kế toán thông qua API kết nối bảo mật hoặc xuất nhập chứng từ tự động.', tbc: true },
      { q: 'Dữ liệu được đồng bộ theo thời gian thực hay theo kỳ?', a: 'Hệ thống cho phép đồng bộ linh hoạt: tự động đồng bộ theo thời gian thực mỗi khi phát sinh giao dịch, theo ngày hoặc kế toán chủ động bấm nút đồng bộ theo từng kỳ chốt sổ.', tbc: true },
      { q: 'Có cần thay đổi hệ thống tài khoản đang sử dụng không?', a: 'Không cần thay đổi. Kế toán chỉ cần cấu hình bảng ánh xạ (mapping) giữa các loại dịch vụ, quỹ tiền của Bellhop với hệ thống tài khoản và danh mục đối tượng sẵn có trên MISA.', tbc: true },
      { q: 'Đồng bộ lỗi thì xử lý thế nào?', a: 'Hệ thống ghi nhận chi tiết tại Nhật ký đồng bộ, hiển thị trạng thái và nguyên nhân cụ thể (thiếu mã hàng, sai định dạng) để kế toán chỉnh sửa và bấm thử lại ngay lập tức.', tbc: true },
      { q: 'Khách sạn có nhiều cơ sở thì đồng bộ ra sao?', a: 'Bellhop Finance hỗ trợ phân quyền và ánh xạ dữ liệu theo từng chi nhánh/cơ sở độc lập hoặc gom dữ liệu về chung một sổ kế toán tổng công ty theo mô hình quản trị của khách sạn.', tbc: true },
      { q: 'Dùng phần mềm kế toán khác MISA có kết nối được không?', a: 'Hiện tại Bellhop Finance tối ưu sâu nhất cho hệ sinh thái MISA. Với các phần mềm kế toán khác (như Fast, Bravo, SAP...), Bellhop cung cấp tính năng xuất file chuẩn hóa Excel/XML hoặc kết nối API mở.', tbc: true }
    ];
    const o = this.state.open;
    const marks = this.props.marks ?? true;
    return {
      markCls: marks ? '' : 'no-marks',
      title: this.props.title ?? 'Câu hỏi thường gặp',
      rows: items.map((it, i) => ({
        q: it.q, a: it.a, tbc: !!it.tbc,
        open: o === i, cls: o === i ? 'open' : '', exp: o === i ? 'true' : 'false',
        toggle: () => this.setState({ open: this.state.open === i ? -1 : i })
      }))
    };
  }
}
</script>
</body>
</html>
