<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="100%" height="100%">
  <defs>
    <!-- Multi-stage realistic shadow for layered depth -->
    <filter id="shadowDisplay" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#0b1a30" flood-opacity="0.18"/>
    </filter>
    <filter id="shadowCard" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#050e1a" flood-opacity="0.26"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#050e1a" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowPill" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#050e1a" flood-opacity="0.3"/>
    </filter>

    <!-- Warm Hotel Lobby Gradients -->
    <linearGradient id="screenBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e1e33"/>
      <stop offset="60%" stop-color="#081424"/>
      <stop offset="100%" stop-color="#040b14"/>
    </linearGradient>

    <radialGradient id="lampGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="woodDesk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a532a"/>
      <stop offset="40%" stop-color="#673c1c"/>
      <stop offset="100%" stop-color="#3d210d"/>
    </linearGradient>

    <linearGradient id="wallSlat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2a1b10"/>
      <stop offset="50%" stop-color="#3b2718"/>
      <stop offset="100%" stop-color="#2a1b10"/>
    </linearGradient>
  </defs>

  <!-- ==================== DISPLAY FRAME (Hotel Reception Scene) ==================== -->
  <g filter="url(#shadowDisplay)">
    <!-- Monitor Outer Chassis -->
    <rect x="40" y="24" width="600" height="460" rx="22" fill="url(#screenBg)" stroke="#1e3a5f" stroke-width="2"/>

    <!-- Inner Reception Environment -->
    <g opacity="0.95">
      <!-- Wooden Slatted Wall Background -->
      <rect x="42" y="26" width="596" height="300" rx="20" fill="url(#wallSlat)"/>
      <!-- Wall Slats -->
      <path d="M70 26v300 M100 26v300 M130 26v300 M160 26v300 M190 26v300 M220 26v300 M250 26v300 M280 26v300 M310 26v300 M340 26v300 M370 26v300 M400 26v300 M430 26v300 M460 26v300 M490 26v300 M520 26v300 M550 26v300 M580 26v300 M610 26v300" stroke="#1f130b" stroke-width="3" opacity="0.45"/>

      <!-- Ambient Lamp Glow -->
      <ellipse cx="480" cy="140" rx="140" ry="110" fill="url(#lampGlow)"/>

      <!-- Warm Hanging Pendant Lamp -->
      <line x1="480" y1="26" x2="480" y2="120" stroke="#94a3b8" stroke-width="1.5"/>
      <path d="M465 120 Q480 110 495 120 L505 138 Q480 144 455 138 Z" fill="#d97706"/>
      <ellipse cx="480" cy="138" rx="25" ry="6" fill="#fef3c7"/>

      <!-- "RECEPTION HOME" Signage on Wall -->
      <rect x="430" y="165" width="135" height="26" rx="4" fill="#121820" opacity="0.75" stroke="#334155" stroke-width="0.8"/>
      <text x="497" y="182" font-family="'Roboto', sans-serif" font-size="11" font-weight="800" fill="#f1f5f9" text-anchor="middle" letter-spacing="1.5">RECEPTION HOME</text>

      <!-- Front Desk Counter -->
      <path d="M42 270 L638 270 L638 482 Q638 484 636 484 L44 484 Q42 484 42 482 Z" fill="#121d2b"/>
      <!-- Countertop wood edge -->
      <rect x="42" y="260" width="596" height="18" fill="url(#woodDesk)"/>
      <line x1="42" y1="260" x2="638" y2="260" stroke="#f59e0b" stroke-width="1.5" opacity="0.4"/>

      <!-- Laptop on Reception Counter (Left) -->
      <g transform="translate(85, 220)">
        <!-- Screen -->
        <rect x="15" y="0" width="105" height="68" rx="5" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
        <rect x="19" y="4" width="97" height="58" rx="2" fill="#1e293b"/>
        <!-- Code lines on laptop -->
        <line x1="25" y1="14" x2="65" y2="14" stroke="#5fb9c2" stroke-width="2"/>
        <line x1="25" y1="22" x2="95" y2="22" stroke="#64748b" stroke-width="1.8"/>
        <line x1="25" y1="30" x2="80" y2="30" stroke="#64748b" stroke-width="1.8"/>
        <line x1="25" y1="38" x2="70" y2="38" stroke="#38bdf8" stroke-width="1.8"/>
        <line x1="25" y1="46" x2="88" y2="46" stroke="#94a3b8" stroke-width="1.8"/>
        <!-- Laptop Base -->
        <path d="M0 68 L135 68 L125 74 L10 74 Z" fill="#475569"/>
      </g>
    </g>
  </g>

  <!-- ==================== CARD 1: TOP-LEFT (Bellhop · Doanh thu 23/10) ==================== -->
  <g filter="url(#shadowCard)" transform="translate(18, 50)">
    <!-- Card Frame -->
    <rect width="335" height="216" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Header Bar -->
    <text x="18" y="31" font-family="'Roboto', sans-serif" font-size="12.5" font-weight="800" fill="#122745">Bellhop · Doanh thu 23/10</text>
    <rect x="254" y="16" width="62" height="22" rx="6" fill="#e0f4f6"/>
    <text x="285" y="31" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#1f7a84" text-anchor="middle">Lễ tân</text>
    <line x1="0" y1="46" x2="335" y2="46" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Table Header -->
    <rect y="47" width="335" height="26" fill="#f8fafc"/>
    <text x="18" y="64" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">CHỨNG TỪ</text>
    <text x="100" y="64" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">DIỄN GIẢI</text>
    <text x="317" y="64" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5" text-anchor="end">SỐ TIỀN</text>
    <line x1="0" y1="73" x2="335" y2="73" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="18" y="101" font-family="'Roboto Mono', monospace" font-size="11.5" font-weight="600" fill="#122745">PT0218</text>
    <text x="100" y="101" font-family="'Roboto', sans-serif" font-size="11.5" fill="#334155">Tiền phòng 101</text>
    <text x="317" y="101" font-family="'Roboto Mono', monospace" font-size="12" font-weight="700" fill="#0f766e" text-anchor="end">2.670.000</text>
    <line x1="18" y1="118" x2="317" y2="118" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="18" y="146" font-family="'Roboto Mono', monospace" font-size="11.5" font-weight="600" fill="#122745">PT0219</text>
    <text x="100" y="146" font-family="'Roboto', sans-serif" font-size="11.5" fill="#334155">F&amp;B bàn B4 → P201</text>
    <text x="317" y="146" font-family="'Roboto Mono', monospace" font-size="12" font-weight="700" fill="#0f766e" text-anchor="end">215.000</text>
    <line x1="18" y1="163" x2="317" y2="163" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Row 3 -->
    <text x="18" y="191" font-family="'Roboto Mono', monospace" font-size="11.5" font-weight="600" fill="#122745">PC0045</text>
    <text x="100" y="191" font-family="'Roboto', sans-serif" font-size="11.5" fill="#334155">Mua nước suối</text>
    <text x="317" y="191" font-family="'Roboto Mono', monospace" font-size="12" font-weight="700" fill="#e11d48" text-anchor="end">-480.000</text>
  </g>

  <!-- ==================== CONNECTING SYNC PILL ==================== -->
  <g filter="url(#shadowPill)" transform="translate(130, 246)">
    <!-- Pill Background -->
    <rect width="215" height="34" rx="17" fill="#0c1f33" stroke="#22d3ee" stroke-width="1.4"/>
    <!-- Glowing Status Indicator -->
    <circle cx="20" cy="17" r="5" fill="#10b981"/>
    <circle cx="20" cy="17" r="8" fill="#10b981" opacity="0.3"/>
    <!-- Pill Text -->
    <text x="34" y="21.5" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#ffffff">Bellhop Finance đồng bộ</text>
    <!-- Sync Arrow -->
    <path d="M194 13l4 4-4 4" stroke="#22d3ee" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- ==================== CARD 2: BOTTOM-RIGHT (MISA · Chứng từ đã nhận) ==================== -->
  <g filter="url(#shadowCard)" transform="translate(230, 276)">
    <!-- Card Frame -->
    <rect width="335" height="216" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Header Bar -->
    <text x="18" y="31" font-family="'Roboto', sans-serif" font-size="12.5" font-weight="800" fill="#122745">MISA · Chứng từ đã nhận</text>
    <rect x="250" y="16" width="66" height="22" rx="6" fill="#ecfdf5"/>
    <text x="283" y="31" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">Kế toán</text>
    <line x1="0" y1="46" x2="335" y2="46" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Table Header -->
    <rect y="47" width="335" height="26" fill="#f8fafc"/>
    <text x="18" y="64" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">SỐ CT</text>
    <text x="100" y="64" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5">TK NỢ / CÓ</text>
    <text x="317" y="64" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.5" text-anchor="end">SỐ TIỀN</text>
    <line x1="0" y1="73" x2="335" y2="73" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Row 1 -->
    <text x="18" y="101" font-family="'Roboto Mono', monospace" font-size="11.5" font-weight="600" fill="#122745">PT0218</text>
    <text x="100" y="101" font-family="'Roboto Mono', monospace" font-size="11.5" fill="#334155">1111 / 5113</text>
    <text x="317" y="101" font-family="'Roboto Mono', monospace" font-size="12" font-weight="700" fill="#0f766e" text-anchor="end">2.670.000</text>
    <line x1="18" y1="118" x2="317" y2="118" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="18" y="146" font-family="'Roboto Mono', monospace" font-size="11.5" font-weight="600" fill="#122745">PT0219</text>
    <text x="100" y="146" font-family="'Roboto Mono', monospace" font-size="11.5" fill="#334155">1111 / 5113</text>
    <text x="317" y="146" font-family="'Roboto Mono', monospace" font-size="12" font-weight="700" fill="#0f766e" text-anchor="end">215.000</text>
    <line x1="18" y1="163" x2="317" y2="163" stroke="#f1f5f9" stroke-width="1"/>

    <!-- Row 3 -->
    <text x="18" y="191" font-family="'Roboto Mono', monospace" font-size="11.5" font-weight="600" fill="#122745">PC0045</text>
    <text x="100" y="191" font-family="'Roboto Mono', monospace" font-size="11.5" fill="#334155">1561 / 1111</text>
    <text x="317" y="191" font-family="'Roboto Mono', monospace" font-size="12" font-weight="700" fill="#0f766e" text-anchor="end">480.000</text>
  </g>

  <!-- ==================== FOOTNOTE ==================== -->
  <text x="340" y="522" font-family="'Roboto', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">✦ Dữ liệu minh họa · tài khoản theo ánh xạ của từng cơ sở</text>
</svg>
