<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" width="100%" height="100%">
  <defs>
    <linearGradient id="misaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdf2e9"/>
      <stop offset="60%" stop-color="#fae5d3"/>
      <stop offset="100%" stop-color="#ebf5fb"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#aed6f1"/>
      <stop offset="100%" stop-color="#85c1e9"/>
    </linearGradient>
    <linearGradient id="mountainMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76d7c4"/>
      <stop offset="100%" stop-color="#48c9b0"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#52be80"/>
      <stop offset="100%" stop-color="#229954"/>
    </linearGradient>
  </defs>

  <rect width="360" height="210" fill="url(#misaSky)"/>
  
  <!-- Mặt trời dịu nhẹ -->
  <circle cx="310" cy="55" r="28" fill="#fdebd0" opacity="0.85"/>
  <circle cx="310" cy="55" r="22" fill="#fcf3cf"/>

  <!-- Dãy núi phía xa -->
  <path d="M0 150 L60 80 L140 155 L210 95 L290 160 L360 110 L360 210 L0 210 Z" fill="url(#mountainBack)" opacity="0.6"/>
  <path d="M0 165 L80 110 L160 170 L240 120 L320 175 L360 145 L360 210 L0 210 Z" fill="url(#mountainMid)" opacity="0.75"/>
  
  <!-- Đồi xanh phía trước -->
  <path d="M-20 180 Q100 135 200 170 T380 165 L380 210 L-20 210 Z" fill="url(#mountainFront)"/>

  <!-- Ngôi nhà nghỉ dưỡng / Villa MISA -->
  <g transform="translate(142, 115)">
    <!-- Mái nhà -->
    <path d="M38 0 L76 22 L0 22 Z" fill="#6e2c00"/>
    <path d="M38 0 L4 22 L72 22 Z" fill="#873600"/>
    <!-- Thân nhà -->
    <rect x="6" y="22" width="64" height="42" fill="#fdfefe" stroke="#d5dbdb" stroke-width="0.8"/>
    <!-- Cửa sổ đôi phát sáng -->
    <rect x="14" y="28" width="18" height="20" rx="2" fill="#fef9e7" stroke="#f39c12" stroke-width="1.2"/>
    <rect x="44" y="28" width="18" height="20" rx="2" fill="#fef9e7" stroke="#f39c12" stroke-width="1.2"/>
    <line x1="23" y1="28" x2="23" y2="48" stroke="#f39c12" stroke-width="0.8"/>
    <line x1="14" y1="38" x2="32" y2="38" stroke="#f39c12" stroke-width="0.8"/>
    <line x1="53" y1="28" x2="53" y2="48" stroke="#f39c12" stroke-width="0.8"/>
    <line x1="44" y1="38" x2="62" y2="38" stroke="#f39c12" stroke-width="0.8"/>
  </g>

  <!-- Hàng cây bên cạnh -->
  <circle cx="120" cy="165" r="14" fill="#1e8449"/>
  <circle cx="130" cy="160" r="10" fill="#27ae60"/>
  <circle cx="230" cy="165" r="15" fill="#1e8449"/>
  <circle cx="242" cy="162" r="11" fill="#2ecc71"/>
</svg>