<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <filter id="heroShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b1a30" flood-opacity="0.14"/>
    </filter>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="tealBtn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f7a84"/>
      <stop offset="100%" stop-color="#5fb9c2"/>
    </linearGradient>
  </defs>

  <!-- Container Box with Shadow -->
  <g filter="url(#heroShadow)">
    <!-- Browser/App Window Frame -->
    <rect x="20" y="20" width="920" height="500" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- App Top Bar -->
    <rect x="20" y="20" width="920" height="54" rx="16" fill="#0f172a"/>
    <rect x="20" y="58" width="920" height="16" fill="#0f172a"/>
    
    <!-- Window Controls -->
    <circle cx="48" cy="47" r="6" fill="#ef4444"/>
    <circle cx="68" cy="47" r="6" fill="#f59e0b"/>
    <circle cx="88" cy="47" r="6" fill="#10b981"/>

    <!-- URL / Status Pill -->
    <rect x="120" y="34" width="300" height="26" rx="13" fill="#1e293b"/>
    <text x="140" y="51" font-family="'Roboto', sans-serif" font-size="12" fill="#94a3b8">bellhop.io/payment/reconciliation</text>

    <!-- Kovena Status Chip -->
    <rect x="740" y="34" width="176" height="26" rx="13" fill="#134e4a"/>
