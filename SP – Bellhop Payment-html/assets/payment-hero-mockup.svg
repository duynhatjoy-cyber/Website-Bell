        <text x="20" y="27" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#2563eb">#KOV-2026-979</text>
        <text x="150" y="27" font-family="'Roboto', sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Trần Tuấn Khang</text>
        <text x="290" y="27" font-family="'Roboto', sans-serif" font-size="12" fill="#334155">Family Room · Zalo OA Chat</text>
        <rect x="470" y="11" width="125" height="22" rx="4" fill="#faf5ff"/>
        <text x="478" y="26" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#7e22ce">Apple Pay / Napas</text>
        <text x="630" y="27" font-family="'Roboto', sans-serif" font-size="13" font-weight="800" fill="#0f172a">2.450.000đ</text>
        <rect x="750" y="11" width="94" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="762" y="26" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#059669">✓ Đã khớp PMS</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 198)">
        <rect width="864" height="44" rx="6" fill="#ffffff" stroke="#f1f5f9"/>
        <text x="20" y="27" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#2563eb">#KOV-2026-978</text>
        <text x="150" y="27" font-family="'Roboto', sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">Lê Hoàng Yến</text>
        <text x="290" y="27" font-family="'Roboto', sans-serif" font-size="12" fill="#334155">Superior Twin · Link đặt phòng</text>
        <rect x="470" y="11" width="125" height="22" rx="4" fill="#ecfdf5"/>
        <text x="478" y="26" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#047857">VietQR Chuyển khoản</text>
        <text x="630" y="27" font-family="'Roboto', sans-serif" font-size="13" font-weight="800" fill="#0f172a">980.000đ</text>
        <rect x="750" y="11" width="94" height="22" rx="11" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
        <text x="762" y="26" font-family="'Roboto', sans-serif" font-size="11" font-weight="700" fill="#059669">✓ Đã khớp PMS</text>
