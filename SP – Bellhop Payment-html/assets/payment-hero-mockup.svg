    <rect x="360" y="86" width="115" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="375" y="104" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#1f7a84">● Tất cả kênh</text>

    <rect x="485" y="86" width="115" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
