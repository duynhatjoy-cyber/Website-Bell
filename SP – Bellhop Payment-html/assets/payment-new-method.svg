<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0b1a30" flood-opacity="0.14"/>
    </filter>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0b1a30" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122745"/>
      <stop offset="100%" stop-color="#1b3963"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f7a84"/>
      <stop offset="100%" stop-color="#34a0ab"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0068ff"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="640" height="460" rx="24" fill="#f8fafc"/>

  <!-- Main Payment Device / Card Container -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="32" width="500" height="396" rx="20" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- App Header Bar -->
    <rect x="70" y="32" width="500" height="64" rx="20" fill="url(#headerGrad)"/>
    <rect x="70" y="76" width="500" height="20" fill="url(#headerGrad)"/>
    <circle cx="102" cy="64" r="16" fill="#1f7a84"/>
    <text x="102" y="69" font-family="Roboto, sans-serif" font-size="14" fill="#ffffff" font-weight="900" text-anchor="middle">B</text>
    <text x="128" y="61" font-family="Roboto, sans-serif" font-size="14" fill="#ffffff" font-weight="700">Bellhop Pay</text>
    <text x="128" y="76" font-family="Roboto, sans-serif" font-size="11" fill="#94a3b8">Hệ thống thanh toán tự động ngành lưu trú</text>
    <rect x="460" y="52" width="90" height="24" rx="12" fill="rgba(95,185,194,0.2)"/>
    <text x="505" y="68" font-family="Roboto, sans-serif" font-size="11" fill="#5fb9c2" font-weight="700" text-anchor="middle">● Trực tuyến</text>

    <!-- Main Payment Summary Card -->
    <rect x="94" y="112" width="452" height="74" rx="14" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="116" y="138" font-family="Roboto, sans-serif" font-size="11" fill="#64748b" font-weight="600">HÓA ĐƠN ĐẶT PHÒNG #BH-8924</text>
    <text x="116" y="166" font-family="Roboto, sans-serif" font-size="20" fill="#122745" font-weight="800">1.450.000 đ</text>
    <rect x="420" y="130" width="106" height="36" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="473" y="152" font-family="Roboto, sans-serif" font-size="11" fill="#047857" font-weight="700" text-anchor="middle">✓ Khớp PMS</text>

    <!-- Payment Options Grid -->
    <text x="96" y="214" font-family="Roboto, sans-serif" font-size="13" fill="#122745" font-weight="700">Chọn phương thức thanh toán nhanh:</text>
    
    <!-- Option 1: VietQR -->
    <rect x="94" y="228" width="140" height="88" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
    <rect x="106" y="240" width="32" height="32" rx="8" fill="#eff6ff"/>
    <path d="M114 248h8v8h-8zM126 248h4v4h-4zM126 260h4v4h-4zM114 260h4v4h-4z" fill="#2563eb"/>
    <text x="146" y="258" font-family="Roboto, sans-serif" font-size="13" fill="#122745" font-weight="700">VietQR</text>
    <text x="146" y="272" font-family="Roboto, sans-serif" font-size="10" fill="#64748b">Quét mã tức thì</text>
    <text x="106" y="302" font-family="Roboto, sans-serif" font-size="10" fill="#2563eb" font-weight="600">● 0đ phí ẩn</text>

    <!-- Option 2: Apple Pay / Google Pay -->
    <rect x="250" y="228" width="140" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="262" y="240" width="32" height="32" rx="8" fill="#f8fafc"/>
    <circle cx="278" cy="256" r="8" fill="#122745"/>
    <text x="302" y="258" font-family="Roboto, sans-serif" font-size="13" fill="#122745" font-weight="700">Apple Pay</text>
    <text x="302" y="272" font-family="Roboto, sans-serif" font-size="10" fill="#64748b">Chạm 1 chạm</text>
    <text x="262" y="302" font-family="Roboto, sans-serif" font-size="10" fill="#059669" font-weight="600">Hỗ trợ thẻ QT</text>

    <!-- Option 3: Thẻ Visa / Master / Napas -->
    <rect x="406" y="228" width="140" height="88" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="418" y="240" width="32" height="32" rx="8" fill="#f8fafc"/>
    <rect x="424" y="248" width="20" height="14" rx="2" fill="#1f7a84"/>
    <text x="458" y="258" font-family="Roboto, sans-serif" font-size="13" fill="#122745" font-weight="700">Thẻ Online</text>
    <text x="458" y="272" font-family="Roboto, sans-serif" font-size="10" fill="#64748b">Visa, Napas</text>
    <text x="418" y="302" font-family="Roboto, sans-serif" font-size="10" fill="#475569" font-weight="600">Bảo mật PCI DSS</text>

    <!-- Bottom Action Button -->
    <rect x="94" y="336" width="452" height="52" rx="12" fill="url(#btnGrad)"/>
    <text x="320" y="367" font-family="Roboto, sans-serif" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">Xác nhận thanh toán ngay →</text>
  </g>

  <!-- Floating Badge 1: Tự động gạch nợ -->
  <g filter="url(#badgeShadow)" transform="translate(30, 290)">
    <rect width="210" height="56" rx="14" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#eff6ff"/>
    <path d="M22 28l4 4 8-8" fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="50" y="25" font-family="Roboto, sans-serif" font-size="12" fill="#122745" font-weight="700">Tự động gạch nợ</text>
    <text x="50" y="42" font-family="Roboto, sans-serif" font-size="10" fill="#64748b">Cập nhật ngay vào Bellhop PMS</text>
  </g>

  <!-- Floating Badge 2: Giảm 90% thao tác thủ công -->
  <g filter="url(#badgeShadow)" transform="translate(420, 80)">
    <rect width="200" height="56" rx="14" fill="#ffffff" stroke="#d1fae5" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="14" fill="#ecfdf5"/>
    <text x="28" y="33" font-family="Roboto, sans-serif" font-size="15" fill="#047857" font-weight="900" text-anchor="middle">⚡</text>
    <text x="50" y="25" font-family="Roboto, sans-serif" font-size="12" fill="#047857" font-weight="700">Giảm tiền mặt &amp; đối soát</text>
    <text x="50" y="42" font-family="Roboto, sans-serif" font-size="10" fill="#64748b">Tiết kiệm 80% công sức lễ tân</text>
  </g>
</svg>

