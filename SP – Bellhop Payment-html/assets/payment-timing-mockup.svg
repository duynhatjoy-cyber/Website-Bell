<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="100%" height="100%">
  <defs>
    <filter id="timingShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b1a30" flood-opacity="0.12"/>
    </filter>
    <filter id="floatCardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0b1a30" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="ptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#122745"/>
      <stop offset="100%" stop-color="#1e3d6b"/>
    </linearGradient>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="520" height="440" rx="20" fill="#f8fafc"/>

  <!-- Main Showcase Window -->
  <g filter="url(#timingShadow)">
    <rect x="25" y="24" width="470" height="392" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect x="25" y="24" width="470" height="52" rx="16" fill="#f8fafc"/>
    <rect x="25" y="52" width="470" height="24" fill="#f8fafc"/>
    <line x1="25" y1="76" x2="495" y2="76" stroke="#e2e8f0" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="48" cy="50" r="5" fill="#cbd5e1"/>
    <circle cx="64" cy="50" r="5" fill="#cbd5e1"/>
    <circle cx="80" cy="50" r="5" fill="#cbd5e1"/>
    <text x="105" y="54" font-family="Roboto, sans-serif" font-size="12" fill="#122745" font-weight="700">Đa điểm chạm thanh toán · Bellhop Payment</text>

    <!-- Point 1: Link Thanh toán Gửi khách -->
    <g transform="translate(45, 96)">
      <rect width="430" height="74" rx="12" fill="#ffffff" stroke="#dde4ec"/>
      <circle cx="36" cy="37" r="18" fill="#e0f2fe"/>
      <path d="M30 37l4 4 8-8" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="30" font-family="Roboto, sans-serif" font-size="13" fill="#122745" font-weight="700">Gửi link đặt cọc trước (Zalo / SMS / Email)</text>
      <text x="66" y="48" font-family="Roboto, sans-serif" font-size="11" fill="#64748b">Khách nhận link, thanh toán qua QR / Thẻ quốc tế</text>
      <rect x="335" y="24" width="82" height="26" rx="13" fill="#ecfdf5"/>
      <text x="376" y="41" font-family="Roboto, sans-serif" font-size="10" fill="#047857" font-weight="700" text-anchor="middle">Đã thu cọc</text>
    </g>

    <!-- Point 2: Thanh toán tại quầy lễ tân -->
    <g transform="translate(45, 186)">
      <rect width="430" height="74" rx="12" fill="#ffffff" stroke="#dde4ec"/>
      <circle cx="36" cy="37" r="18" fill="#e6f7f8"/>
      <rect x="29" y="30" width="14" height="14" rx="3" fill="#1f7a84"/>
      <path d="M33 37h6" stroke="#ffffff" stroke-width="1.5"/>
      <text x="66" y="30" font-family="Roboto, sans-serif" font-size="13" fill="#122745" font-weight="700">Thanh toán tại quầy khi Check-in / Out</text>
      <text x="66" y="48" font-family="Roboto, sans-serif" font-size="11" fill="#64748b">Quét QR động hoặc POS quẹt thẻ tự động lưu hóa đơn</text>
      <rect x="335" y="24" width="82" height="26" rx="13" fill="#ecfdf5"/>
      <text x="376" y="41" font-family="Roboto, sans-serif" font-size="10" fill="#047857" font-weight="700" text-anchor="middle">Khớp Folio</text>
    </g>

    <!-- Point 3: Phí No-show / Hủy phòng tự động -->
    <g transform="translate(45, 276)">
      <rect width="430" height="74" rx="12" fill="#ffffff" stroke="#dde4ec"/>
      <circle cx="36" cy="37" r="18" fill="#fef3c7"/>
      <path d="M36 29v10M36 43h.01" stroke="#d97706" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="30" font-family="Roboto, sans-serif" font-size="13" fill="#122745" font-weight="700">Xử lý phí hủy phòng &amp; No-show</text>
      <text x="66" y="48" font-family="Roboto, sans-serif" font-size="11" fill="#64748b">Cấn trừ cọc hoặc thu phí hủy theo đúng chính sách cơ sở</text>
      <rect x="335" y="24" width="82" height="26" rx="13" fill="#f1f5f9"/>
      <text x="376" y="41" font-family="Roboto, sans-serif" font-size="10" fill="#475569" font-weight="700" text-anchor="middle">Tự động</text>
    </g>

    <!-- Status bottom bar -->
    <rect x="45" y="366" width="430" height="34" rx="8" fill="#f8fafc"/>
    <circle cx="62" cy="383" r="4" fill="#10b981"/>
    <text x="74" y="387" font-family="Roboto, sans-serif" font-size="11" fill="#122745" font-weight="600">Đồng bộ tức thì mọi giao dịch vào Bellhop PMS &amp; Finance</text>
  </g>

  <!-- Floating Badge: Đồng bộ thời gian thực -->
  <g filter="url(#floatCardShadow)" transform="translate(320, 290)">
    <rect width="180" height="52" rx="12" fill="#122745"/>
    <circle cx="26" cy="26" r="12" fill="#1f7a84"/>
    <text x="26" y="30" font-family="Roboto, sans-serif" font-size="12" fill="#ffffff" font-weight="900" text-anchor="middle">✓</text>
    <text x="46" y="23" font-family="Roboto, sans-serif" font-size="11" fill="#ffffff" font-weight="700">Đồng bộ tự động</text>
    <text x="46" y="38" font-family="Roboto, sans-serif" font-size="9.5" fill="#94a3b8">Không sót bất kỳ giao dịch nào</text>
  </g>
</svg>

