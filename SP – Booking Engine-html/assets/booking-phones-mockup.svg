<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 520" width="100%" height="100%">
  <defs>
    <filter id="shadowPhones" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0b1a30" flood-opacity="0.18"/>
    </filter>
    <linearGradient id="roomGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbebf0"/>
      <stop offset="100%" stop-color="#9dd7de"/>
    </linearGradient>
    <linearGradient id="roomGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- ==================== PHONE 1: CHỌN NGÀY & KHÁCH ==================== -->
  <g filter="url(#shadowPhones)" transform="translate(40, 20)">
    <!-- Phone Chassis -->
    <rect width="270" height="480" rx="38" fill="#0e2038" stroke="#1f2937" stroke-width="3.5"/>
    <rect x="9" y="9" width="252" height="462" rx="30" fill="#ffffff"/>
    
    <!-- Phone Header -->
    <rect x="9" y="9" width="252" height="68" rx="30" fill="#122745"/>
    <rect x="9" y="45" width="252" height="32" fill="#122745"/>
    <text x="26" y="44" font-family="'Roboto', sans-serif" font-size="14.5" fill="#ffffff" font-weight="700">1. Chọn ngày &amp; khách</text>
    <text x="26" y="62" font-family="'Roboto', sans-serif" font-size="11.5" fill="#a9bbd1">Khách sạn Bellhop Boutique</text>

    <!-- Field 1: Ngày nhận - trả phòng -->
    <rect x="24" y="90" width="222" height="50" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="109" font-family="'Roboto', sans-serif" font-size="10.5" fill="#64748b">Ngày nhận - trả phòng</text>
    <text x="36" y="129" font-family="'Roboto', sans-serif" font-size="13" fill="#122745" font-weight="700">23/10 – 25/10 (2 đêm)</text>

    <!-- Field 2: Số lượng khách -->
    <rect x="24" y="150" width="222" height="50" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="169" font-family="'Roboto', sans-serif" font-size="10.5" fill="#64748b">Số lượng khách</text>
    <text x="36" y="189" font-family="'Roboto', sans-serif" font-size="13" fill="#122745" font-weight="700">2 người lớn · 0 trẻ em</text>

    <!-- Mini Calendar Card -->
    <rect x="24" y="210" width="222" height="186" rx="10" fill="#f1f5f9"/>
    <text x="40" y="234" font-family="'Roboto', sans-serif" font-size="12" fill="#122745" font-weight="700">Tháng 10 · 2026</text>
    
    <!-- Weekday headers -->
    <g font-family="'Roboto', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
      <text x="44" y="254">T2</text>
      <text x="74" y="254">T3</text>
      <text x="104" y="254">T4</text>
      <text x="135" y="254">T5</text>
      <text x="166" y="254">T6</text>
      <text x="196" y="254">T7</text>
      <text x="226" y="254">CN</text>
    </g>

    <!-- Calendar days grid -->
    <g font-family="'Roboto', sans-serif" font-size="11" fill="#334155" text-anchor="middle">
      <text x="44" y="278">19</text>
      <text x="74" y="278">20</text>
      <text x="104" y="278">21</text>
      <text x="135" y="278">22</text>
      <!-- Selected 23 - 25 pill -->
      <rect x="150" y="263" width="62" height="22" rx="6" fill="#1f7a84"/>
      <text x="166" y="278" fill="#ffffff" font-weight="700">23</text>
      <text x="196" y="278" fill="#ffffff" font-weight="700">25</text>
      <text x="226" y="278">26</text>
      
      <text x="44" y="306">27</text>
      <text x="74" y="306">28</text>
      <text x="104" y="306">29</text>
      <text x="135" y="306">30</text>
      <text x="166" y="306">31</text>
      <text x="196" y="306" fill="#94a3b8">1</text>
      <text x="226" y="306" fill="#94a3b8">2</text>
    </g>

    <!-- Calendar selected range notice -->
    <rect x="40" y="330" width="190" height="28" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="135" y="348" font-family="'Roboto', sans-serif" font-size="11" fill="#1f7a84" font-weight="600" text-anchor="middle">Đã chọn: 23/10 → 25/10 (2 đêm)</text>

    <!-- Action Button -->
    <rect x="24" y="410" width="222" height="46" rx="12" fill="#122745"/>
    <text x="135" y="438" font-family="'Roboto', sans-serif" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">Tìm phòng</text>
  </g>

  <!-- ==================== PHONE 2: CHỌN HẠNG PHÒNG ==================== -->
  <g filter="url(#shadowPhones)" transform="translate(395, 20)">
    <!-- Phone Chassis -->
    <rect width="270" height="480" rx="38" fill="#0e2038" stroke="#1f2937" stroke-width="3.5"/>
    <rect x="9" y="9" width="252" height="462" rx="30" fill="#ffffff"/>
    
    <!-- Phone Header -->
    <rect x="9" y="9" width="252" height="68" rx="30" fill="#122745"/>
    <rect x="9" y="45" width="252" height="32" fill="#122745"/>
    <text x="26" y="44" font-family="'Roboto', sans-serif" font-size="14.5" fill="#ffffff" font-weight="700">2. Chọn hạng phòng</text>
    <text x="26" y="62" font-family="'Roboto', sans-serif" font-size="11.5" fill="#a9bbd1">23 – 25/10 · 2 khách</text>

    <!-- Room 1: Deluxe Đôi -->
    <rect x="22" y="88" width="226" height="148" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="22" y="88" width="226" height="70" rx="10" fill="url(#roomGrad1)"/>
    <!-- Room 1 preview badge -->
    <rect x="32" y="98" width="80" height="18" rx="4" fill="rgba(18,39,69,0.7)"/>
    <text x="72" y="111" font-family="'Roboto', sans-serif" font-size="9.5" fill="#ffffff" font-weight="600" text-anchor="middle">Ảnh hạng phòng</text>
    
    <text x="34" y="176" font-family="'Roboto', sans-serif" font-size="13.5" fill="#122745" font-weight="700">Phòng Deluxe Đôi</text>
    <text x="34" y="194" font-family="'Roboto', sans-serif" font-size="11" fill="#64748b">25m² · Cửa sổ phố · Bữa sáng</text>
    <text x="34" y="222" font-family="'Roboto', sans-serif" font-size="14" fill="#1f7a84" font-weight="800">890.000đ<tspan font-size="10.5" font-weight="400" fill="#64748b">/đêm</tspan></text>
    <rect x="176" y="204" width="62" height="24" rx="6" fill="#1f7a84"/>
    <text x="207" y="220" font-family="'Roboto', sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">Chọn</text>

    <!-- Room 2: Family Suite -->
    <rect x="22" y="248" width="226" height="148" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
    <rect x="22" y="248" width="226" height="70" rx="10" fill="url(#roomGrad2)"/>
    <!-- Room 2 preview badge -->
    <rect x="32" y="258" width="80" height="18" rx="4" fill="rgba(18,39,69,0.7)"/>
    <text x="72" y="271" font-family="'Roboto', sans-serif" font-size="9.5" fill="#ffffff" font-weight="600" text-anchor="middle">Ảnh hạng phòng</text>

    <text x="34" y="336" font-family="'Roboto', sans-serif" font-size="13.5" fill="#122745" font-weight="700">Phòng Family Suite</text>
    <text x="34" y="354" font-family="'Roboto', sans-serif" font-size="11" fill="#64748b">40m² · 2 giường lớn · Ban công</text>
    <text x="34" y="382" font-family="'Roboto', sans-serif" font-size="14" fill="#1f7a84" font-weight="800">1.350.000đ<tspan font-size="10.5" font-weight="400" fill="#64748b">/đêm</tspan></text>
    <rect x="176" y="364" width="62" height="24" rx="6" fill="#122745"/>
    <text x="207" y="380" font-family="'Roboto', sans-serif" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">Chọn</text>

    <!-- Action Button (Matching baseline with Phone 1 and 3) -->
    <rect x="22" y="410" width="226" height="46" rx="12" fill="#1f7a84"/>
    <text x="135" y="438" font-family="'Roboto', sans-serif" font-size="13.5" fill="#ffffff" font-weight="700" text-anchor="middle">Tiếp tục đặt phòng</text>
  </g>

  <!-- ==================== PHONE 3: XÁC NHẬN & THANH TOÁN ==================== -->
  <g filter="url(#shadowPhones)" transform="translate(750, 20)">
    <!-- Phone Chassis -->
    <rect width="270" height="480" rx="38" fill="#0e2038" stroke="#1f2937" stroke-width="3.5"/>
    <rect x="9" y="9" width="252" height="462" rx="30" fill="#ffffff"/>
    
    <!-- Phone Header -->
    <rect x="9" y="9" width="252" height="68" rx="30" fill="#122745"/>
    <rect x="9" y="45" width="252" height="32" fill="#122745"/>
    <text x="26" y="44" font-family="'Roboto', sans-serif" font-size="14.5" fill="#ffffff" font-weight="700">3. Xác nhận đặt phòng</text>
    <text x="26" y="62" font-family="'Roboto', sans-serif" font-size="11.5" fill="#a9bbd1">Deluxe · 2 đêm · 2 khách</text>

    <!-- Field 1: Họ và tên -->
    <rect x="24" y="90" width="222" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="108" font-family="'Roboto', sans-serif" font-size="10.5" fill="#64748b">Họ và tên</text>
    <text x="36" y="126" font-family="'Roboto', sans-serif" font-size="12.5" fill="#122745" font-weight="700">Nguyễn Thu Hà</text>

    <!-- Field 2: Số điện thoại -->
    <rect x="24" y="146" width="222" height="46" rx="9" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="36" y="164" font-family="'Roboto', sans-serif" font-size="10.5" fill="#64748b">Số điện thoại</text>
    <text x="36" y="182" font-family="'Roboto', sans-serif" font-size="12.5" fill="#122745" font-weight="700">0912 345 678</text>

    <!-- Payment Breakdown Box -->
    <rect x="24" y="202" width="222" height="106" rx="9" fill="#f1f5f9"/>
    <text x="36" y="226" font-family="'Roboto', sans-serif" font-size="11.5" fill="#64748b">Tiền phòng (2 đêm):</text>
    <text x="180" y="226" font-family="'Roboto', sans-serif" font-size="11.5" fill="#122745" font-weight="600">1.780.000đ</text>
    
    <text x="36" y="248" font-family="'Roboto', sans-serif" font-size="11.5" fill="#64748b">Giảm giá trực tiếp:</text>
    <text x="190" y="248" font-family="'Roboto', sans-serif" font-size="11.5" fill="#10b981" font-weight="600">-100.000đ</text>
    
    <line x1="36" y1="262" x2="234" y2="262" stroke="#cbd5e1" stroke-width="1"/>
    
    <text x="36" y="286" font-family="'Roboto', sans-serif" font-size="12.5" fill="#122745" font-weight="700">Tổng thanh toán:</text>
    <text x="168" y="286" font-family="'Roboto', sans-serif" font-size="13.5" fill="#1f7a84" font-weight="800">1.680.000đ</text>

    <!-- Instant Guarantee Badge -->
    <rect x="24" y="320" width="222" height="36" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="135" y="343" font-family="'Roboto', sans-serif" font-size="11.5" fill="#047857" font-weight="700" text-anchor="middle">✓ Giữ phòng tức thì · Không cần cọc</text>

    <!-- Action Button (Matching baseline) -->
    <rect x="24" y="410" width="222" height="46" rx="12" fill="#1f7a84"/>
    <text x="135" y="438" font-family="'Roboto', sans-serif" font-size="13.5" fill="#ffffff" font-weight="800" text-anchor="middle">Hoàn tất đặt phòng</text>
  </g>
</svg>
