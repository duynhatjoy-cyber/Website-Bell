<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" width="100%" height="100%">
  <defs>
    <linearGradient id="villaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5fb5e0"/>
      <stop offset="65%" stop-color="#a5e3f6"/>
      <stop offset="100%" stop-color="#e0f7fc"/>
    </linearGradient>
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="pillShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#091322" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Bầu trời nhiệt đới nắng trong -->
  <rect width="360" height="210" fill="url(#villaSky)"/>

  <!-- Mặt đất cỏ và sân villa -->
  <rect x="0" y="145" width="360" height="65" fill="#4ade80" opacity="0.85"/>
  <rect x="30" y="152" width="300" height="58" fill="#f1f5f9"/>

  <!-- Biệt thự hiện đại 2 tầng -->
  <g id="modern-villa">
    <!-- Khối tầng trệt -->
    <rect x="85" y="85" width="180" height="70" fill="#ffffff" rx="2" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Cửa kính tầng trệt lớn -->
    <rect x="100" y="98" width="85" height="57" fill="#bae6fd" opacity="0.75" rx="1"/>
    <line x1="142" y1="98" x2="142" y2="155" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="195" y="98" width="60" height="57" fill="#e2e8f0" rx="1"/>
    <rect x="205" y="106" width="40" height="49" fill="#0f172a" rx="1"/>

    <!-- Khối tầng 2 (Nhô ra hiện đại) -->
    <rect x="120" y="45" width="135" height="46" fill="#f8fafc" rx="2" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="135" y="52" width="105" height="34" fill="#38bdf8" opacity="0.65" rx="1"/>
    <line x1="187" y1="52" x2="187" y2="86" stroke="#0284c7" stroke-width="1.5"/>

    <!-- Mái phẳng và lam chắn nắng -->
    <rect x="115" y="42" width="145" height="5" fill="#334155" rx="1"/>
    <rect x="80" y="82" width="190" height="4" fill="#64748b" rx="1"/>
  </g>

  <!-- Hồ bơi xanh mát phía trước -->
  <g id="pool">
    <rect x="75" y="162" width="200" height="48" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <rect x="80" y="166" width="190" height="44" rx="4" fill="url(#poolGrad)"/>
    <!-- Gợn sóng nước -->
    <path d="M90 178 Q110 174 130 178 T170 178 T210 178 T250 178" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.6"/>
    <path d="M100 192 Q120 188 140 192 T180 192 T220 192 T260 192" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
  </g>

  <!-- Cây dừa bên trái -->
  <g transform="translate(35, 175)">
    <!-- Thân cây cong -->
    <path d="M15 0 Q5 -55 25 -95" fill="none" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Tán lá dừa -->
    <g transform="translate(25, -95)">
      <path d="M0 0 Q-25 -15 -45 -5" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 0 Q-15 -30 -30 -35" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 0 Q15 -35 25 -30" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 0 Q30 -15 45 -5" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 0 Q10 20 25 30" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Cây dừa bên phải -->
  <g transform="translate(305, 170)">
    <path d="M10 0 Q20 -50 0 -90" fill="none" stroke="#78350f" stroke-width="4.5" stroke-linecap="round"/>
    <g transform="translate(0, -90)">
      <path d="M0 0 Q-25 -25 -40 -15" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 0 Q-5 -35 5 -40" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 0 Q25 -25 35 -15" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
      <path d="M0 0 Q20 5 30 20" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Ghế tắm nắng cạnh hồ bơi -->
  <g transform="translate(48, 178)">
    <polygon points="0,8 14,3 24,8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
    <circle cx="8" cy="11" r="1.5" fill="#38bdf8"/>
  </g>

  <!-- Badge góc trên bên trái: Villa / Resort -->
  <g transform="translate(18, 16)">
    <rect width="84" height="22" rx="11" fill="rgba(15, 23, 42, 0.45)" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1"/>
    <text x="42" y="15" fill="#ffffff" font-family="-apple-system, Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Villa / Resort</text>
  </g>

  <!-- Floating Pill góc dưới bên phải: Website + Booking -->
  <g transform="translate(180, 160)" filter="url(#pillShadow)">
    <rect width="162" height="38" rx="19" fill="#ffffff"/>
    <!-- Icon Laptop / Web -->
    <g transform="translate(14, 11)">
      <rect x="2" y="1" width="16" height="11" rx="2" fill="#e6f7f8" stroke="#1f7a84" stroke-width="1.4"/>
      <line x1="0" y1="14" x2="20" y2="14" stroke="#1f7a84" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="10" cy="6" r="1.5" fill="#1f7a84"/>
    </g>
    <text x="42" y="24" fill="#0f172a" font-family="-apple-system, Roboto, sans-serif" font-size="12" font-weight="700">Website + Booking</text>
  </g>
</svg>
