<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0b1a30" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Browser Window -->
  <g filter="url(#shadow)">
    <rect x="20" y="20" width="580" height="400" rx="14" fill="#ffffff" stroke="#dde4ec" stroke-width="1.5"/>
