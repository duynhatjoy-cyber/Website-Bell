    <text x="330" y="94" font-family="Roboto, sans-serif" font-size="11" fill="#566579" font-weight="600">Th 5</text>
    <text x="390" y="94" font-family="Roboto, sans-serif" font-size="11" fill="#566579" font-weight="600">Th 6</text>
    <text x="450" y="94" font-family="Roboto, sans-serif" font-size="11" fill="#566579" font-weight="600">Th 7</text>
    <text x="510" y="94" font-family="Roboto, sans-serif" font-size="11" fill="#566579" font-weight="600">CN</text>

