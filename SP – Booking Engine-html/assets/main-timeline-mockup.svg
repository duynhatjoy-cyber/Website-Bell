    <text x="554" y="261" font-family="Roboto, sans-serif" font-size="12" fill="#122745" font-weight="600">Bổ sung minibar</text>
    <rect x="660" y="246" width="48" height="22" rx="6" fill="#fef3eb"/>
    <text x="672" y="261" font-family="Roboto, sans-serif" font-size="10" fill="#b25e09" font-weight="700">Chờ</text>

    <!-- Done Action Button -->
    <rect x="542" y="296" width="176" height="40" rx="10" fill="#1f7a84"/>
    <text x="585" y="321" font-family="Roboto, sans-serif" font-size="12" fill="#ffffff" font-weight="700">Báo đã dọn xong</text>
