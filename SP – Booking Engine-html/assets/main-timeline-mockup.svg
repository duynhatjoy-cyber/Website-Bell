    <rect x="528" y="148" width="204" height="30" fill="#122745"/>
    <text x="546" y="146" font-family="Roboto, sans-serif" font-size="13" fill="#ffffff" font-weight="700">Phòng 203</text>
    <text x="546" y="164" font-family="Roboto, sans-serif" font-size="11" fill="#a9bbd1">Cần dọn → Đang dọn</text>

    <!-- Phone Tasks -->
