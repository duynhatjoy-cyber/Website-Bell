    <text x="60" y="292" font-family="Roboto, sans-serif" font-size="12" fill="#122745" font-weight="700">301</text>
    <rect x="140" y="276" width="110" height="26" rx="6" fill="#0071c2"/>
    <text x="152" y="293" font-family="Roboto, sans-serif" font-size="11" fill="#ffffff" font-weight="600">Traveloka</text>
    <rect x="320" y="276" width="120" height="26" rx="6" fill="#122745"/>
    <text x="332" y="293" font-family="Roboto, sans-serif" font-size="11" fill="#ffffff" font-weight="600">Mr. Kim · 2 đêm</text>
