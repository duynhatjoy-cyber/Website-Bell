<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" width="100%" height="100%">
  <defs>
    <filter id="card-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#071324" flood-opacity="0.18"/>
    </filter>
    <filter id="pill-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0b1b32" flood-opacity="0.16"/>
    </filter>
    <!-- Spotlight gradient -->
    <linearGradient id="lightCone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#facc15" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </linearGradient>
    <!-- Gold gradient for bell & sign -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect width="420" height="460" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base Card Background -->
    <rect width="420" height="460" fill="#0c1d33"/>

    <!-- Wood Wall Background -->
    <rect x="0" y="40" width="420" height="230" fill="#8c582d"/>
    <!-- Wood slats lines -->
    <line x1="35" y1="40" x2="35" y2="270" stroke="#784820" stroke-width="2"/>
    <line x1="70" y1="40" x2="70" y2="270" stroke="#784820" stroke-width="2"/>
    <line x1="105" y1="40" x2="105" y2="270" stroke="#784820" stroke-width="2"/>
    <line x1="140" y1="40" x2="140" y2="270" stroke="#784820" stroke-width="2"/>
    <line x1="175" y1="40" x2="175" y2="270" stroke="#784820" stroke-width="2"/>
    <line x1="210" y1="40" x2="210" y2="270" stroke="#784820" stroke-width="2"/>
    <line x1="245" y1="40" x2="245" y2="270" stroke="#784820" stroke-width="2"/>
    <line x1="280" y1="40" x2="280" y2="270" stroke="#784820" stroke-width="2"/>
    <line x1="315" y1="40" x2="315" y2="270" stroke="#784820" stroke-width="2"/>
    <line x1="350" y1="40" x2="350" y2="270" stroke="#784820" stroke-width="2"/>
    <line x1="385" y1="40" x2="385" y2="270" stroke="#784820" stroke-width="2"/>

    <!-- Spotlights Cones -->
    <!-- Light 1 -->
    <polygon points="68,66 12,250 124,250" fill="url(#lightCone)"/>
    <!-- Light 2 (Center) -->
    <polygon points="210,60 144,250 276,250" fill="url(#lightCone)"/>
    <!-- Light 3 -->
    <polygon points="352,66 296,250 408,250" fill="url(#lightCone)"/>

    <!-- Ceiling Lamps -->
    <!-- Lamp 1 -->
    <line x1="68" y1="40" x2="68" y2="60" stroke="#fef08a" stroke-width="2"/>
    <path d="M54 66 C54 60 82 60 82 66 Z" fill="url(#goldGrad)"/>
    <circle cx="68" cy="67" r="3" fill="#ffffff"/>

    <!-- Lamp 2 -->
    <line x1="210" y1="40" x2="210" y2="54" stroke="#fef08a" stroke-width="2"/>
    <path d="M196 60 C196 54 224 54 224 60 Z" fill="url(#goldGrad)"/>
    <circle cx="210" cy="61" r="3" fill="#ffffff"/>

    <!-- Lamp 3 -->
    <line x1="352" y1="40" x2="352" y2="60" stroke="#fef08a" stroke-width="2"/>
    <path d="M338 66 C338 60 366 60 366 66 Z" fill="url(#goldGrad)"/>
    <circle cx="352" cy="67" r="3" fill="#ffffff"/>

    <!-- RECEPTION Sign -->
    <g filter="url(#card-shadow)">
      <rect x="135" y="96" width="150" height="52" rx="8" fill="#0c1d33" stroke="#b48c4a" stroke-width="1.8"/>
      <text x="210" y="122" font-family="'Roboto', sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="3" text-anchor="middle">RECEPTION</text>
      <text x="210" y="137" font-family="'Roboto', sans-serif" font-size="8.5" font-weight="600" fill="#5fb9c2" letter-spacing="2" text-anchor="middle">WELCOME</text>
    </g>

    <!-- Counter Top Surface -->
    <rect x="0" y="258" width="420" height="24" fill="#cbd5e1"/>
    <rect x="0" y="278" width="420" height="6" fill="#94a3b8"/>
    <!-- Counter Desk Body -->
    <rect x="0" y="284" width="420" height="176" fill="#0f243e"/>

    <!-- Service Bell on Desk -->
    <g transform="translate(230, 230)">
      <ellipse cx="26" cy="36" rx="26" ry="6" fill="#94a3b8"/>
      <path d="M6 36 C6 18 46 18 46 36 Z" fill="url(#goldGrad)"/>
      <rect x="23" y="14" width="6" height="5" rx="1.5" fill="url(#goldGrad)"/>
      <ellipse cx="26" cy="14" rx="4" ry="2" fill="#fef08a"/>
    </g>

    <!-- Room Key Card 203 -->
    <g transform="translate(325, 246) rotate(6)">
      <rect x="0" y="0" width="58" height="38" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="0" y="28" width="58" height="10" rx="3" fill="#1f7a84"/>
      <text x="29" y="19" font-family="'Roboto', sans-serif" font-size="12" font-weight="800" fill="#122745" text-anchor="middle">203</text>
    </g>

    <!-- Laptop with Booking Screen -->
    <g transform="translate(28, 172)">
      <!-- Laptop Screen -->
      <rect x="8" y="0" width="156" height="104" rx="8" fill="#122745" stroke="#475569" stroke-width="2"/>
      <rect x="14" y="6" width="144" height="92" rx="4" fill="#ffffff"/>
      <!-- Window top bar -->
      <rect x="14" y="6" width="144" height="14" fill="#f1f5f9"/>
      <circle cx="22" cy="13" r="2.5" fill="#ef4444"/>
      <circle cx="29" cy="13" r="2.5" fill="#f59e0b"/>
      <circle cx="36" cy="13" r="2.5" fill="#10b981"/>
      <!-- Screen content / Dashboard mockup -->
      <rect x="20" y="28" width="132" height="10" rx="3" fill="#1f7a84"/>
      <rect x="20" y="44" width="60" height="7" rx="2" fill="#e2e8f0"/>
      <rect x="86" y="44" width="40" height="7" rx="2" fill="#38bdf8"/>
      <rect x="20" y="56" width="45" height="7" rx="2" fill="#003580"/>
      <rect x="70" y="56" width="56" height="7" rx="2" fill="#122745"/>
      <rect x="20" y="68" width="75" height="7" rx="2" fill="#5fb9c2"/>
      <rect x="100" y="68" width="26" height="7" rx="2" fill="#e2e8f0"/>
      <rect x="20" y="80" width="50" height="7" rx="2" fill="#1f7a84"/>
      <rect x="76" y="80" width="50" height="7" rx="2" fill="#f59e0b"/>
      <!-- Laptop Base -->
      <path d="M0 104 L172 104 L160 112 L12 112 Z" fill="#94a3b8"/>
      <rect x="68" y="104" width="36" height="3" rx="1.5" fill="#64748b"/>
    </g>

    <!-- Top Left Badge: Ảnh minh họa -->
    <rect x="16" y="16" width="190" height="26" rx="13" fill="rgba(12,29,51,0.75)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="111" y="33" font-family="'Roboto', sans-serif" font-size="10" font-weight="500" fill="#e2e8f0" text-anchor="middle">Ảnh minh họa · thay bằng ảnh thực</text>

    <!-- Floating Badge 1: 3 cuộc gọi hỏi phòng -->
    <g filter="url(#pill-shadow)" transform="translate(18, 312)">
      <rect width="216" height="54" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Phone Icon circle -->
      <rect x="12" y="11" width="32" height="32" rx="10" fill="#e0f2fe"/>
      <svg x="18" y="17" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
      </svg>
      <text x="54" y="27" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#122745">3 cuộc gọi hỏi phòng</text>
      <text x="54" y="42" font-family="'Roboto', sans-serif" font-size="10.5" font-weight="500" fill="#64748b">Chưa kịp trả lời</text>
    </g>

    <!-- Floating Badge 2: Hoa hồng OTA -->
    <g filter="url(#pill-shadow)" transform="translate(186, 382)">
      <rect width="216" height="54" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
      <!-- Percentage / Coin Icon circle -->
      <rect x="12" y="11" width="32" height="32" rx="10" fill="#fef3c7"/>
      <svg x="18" y="17" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="5" x2="5" y2="19"/>
        <circle cx="6.5" cy="6.5" r="2.5"/>
        <circle cx="17.5" cy="17.5" r="2.5"/>
      </svg>
      <text x="54" y="27" font-family="'Roboto', sans-serif" font-size="12" font-weight="700" fill="#122745">Hoa hồng OTA</text>
      <text x="54" y="42" font-family="'Roboto', sans-serif" font-size="10.5" font-weight="500" fill="#64748b">Trừ trên mỗi đặt phòng</text>
    </g>
  </g>
</svg>

