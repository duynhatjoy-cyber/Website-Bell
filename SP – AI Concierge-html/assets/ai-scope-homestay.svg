<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 280" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a3b69"/>
      <stop offset="45%" stop-color="#73527b"/>
      <stop offset="75%" stop-color="#ba7079"/>
      <stop offset="100%" stop-color="#e29b8c"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#ecd9c6"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c85a48"/>
      <stop offset="100%" stop-color="#8a3026"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#122745" flood-opacity="0.16"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Sky -->
  <rect width="540" height="280" rx="16" fill="url(#skyGrad)"/>

  <!-- Distant Hills / Trees -->
  <path d="M0 240 Q140 190 280 230 T540 210 L540 280 L0 280 Z" fill="#32243d" opacity="0.65"/>
  <path d="M0 250 Q180 220 360 250 T540 235 L540 280 L0 280 Z" fill="#20172e"/>

  <!-- House Body -->
  <g transform="translate(60, 60)">
    <!-- Main Wall -->
    <rect x="70" y="70" width="280" height="150" rx="4" fill="url(#wallGrad)"/>
    
    <!-- Roof -->
    <polygon points="50,75 210,5 370,75" fill="url(#roofGrad)"/>
    <polygon points="45,78 210,6 375,78 370,70 210,0 50,70" fill="#6d251d"/>

    <!-- Door (Arch) -->
    <path d="M185 220 V155 A25 25 0 0 1 235 155 V220 Z" fill="#5c3826"/>
    <!-- Door Knob -->
    <circle cx="226" cy="188" r="3.5" fill="#f6d365"/>

    <!-- Windows (Warm Light) -->
    <rect x="100" y="105" width="50" height="55" rx="4" fill="#ffea9f" stroke="#d5b48d" stroke-width="3"/>
    <line x1="125" y1="105" x2="125" y2="160" stroke="#a07a50" stroke-width="2"/>
    <line x1="100" y1="132" x2="150" y2="132" stroke="#a07a50" stroke-width="2"/>

    <rect x="270" y="105" width="50" height="55" rx="4" fill="#ffea9f" stroke="#d5b48d" stroke-width="3"/>
    <line x1="295" y1="105" x2="295" y2="160" stroke="#a07a50" stroke-width="2"/>
    <line x1="270" y1="132" x2="320" y2="132" stroke="#a07a50" stroke-width="2"/>

    <!-- Ground shrubs -->
    <circle cx="65" cy="220" r="24" fill="#2d5a43"/>
    <circle cx="85" cy="222" r="18" fill="#3b7256"/>
    <circle cx="340" cy="220" r="22" fill="#2d5a43"/>
    <circle cx="365" cy="222" r="19" fill="#3b7256"/>

    <!-- String Fairy Lights under eaves -->
    <path d="M50 78 Q110 98 170 82 T290 85 T370 78" fill="none" stroke="#684a32" stroke-width="1.8"/>
    <!-- Glowing Bulbs -->
    <g filter="url(#glow)">
      <circle cx="70" cy="85" r="5" fill="#fff7b2"/>
      <circle cx="100" cy="91" r="5" fill="#ffe680"/>
      <circle cx="130" cy="90" r="5" fill="#fff7b2"/>
      <circle cx="160" cy="85" r="5" fill="#ffe680"/>
      <circle cx="190" cy="83" r="5" fill="#fff7b2"/>
      <circle cx="225" cy="84" r="5" fill="#ffe680"/>
      <circle cx="255" cy="87" r="5" fill="#fff7b2"/>
      <circle cx="285" cy="86" r="5" fill="#ffe680"/>
      <circle cx="315" cy="84" r="5" fill="#fff7b2"/>
      <circle cx="345" cy="81" r="5" fill="#ffe680"/>
    </g>
  </g>

  <!-- Foreground Bushes on left and right -->
  <path d="M-20 280 C20 240 60 250 90 280 Z" fill="#1e3b2e"/>
  <path d="M450 280 C480 235 520 245 560 280 Z" fill="#1e3b2e"/>

  <!-- Chat Bubble Overlay -->
  <g filter="url(#cardShadow)" transform="translate(18, 175)">
    <!-- Bubble tail & body -->
    <rect width="250" height="42" rx="21" fill="#ffffff"/>
    <path d="M30 42 L24 50 L40 42 Z" fill="#ffffff"/>
    <!-- Text -->
    <text x="24" y="26" font-family="'Roboto', 'Inter', -apple-system, sans-serif" font-size="13" font-weight="600" fill="#122745">Dạ, homestay nhận thú cưng nhỏ ạ.</text>
  </g>
</svg>

