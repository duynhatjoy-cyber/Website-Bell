<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="50%" stop-color="#24223f"/>
      <stop offset="85%" stop-color="#543854"/>
      <stop offset="100%" stop-color="#7a4658"/>
    </linearGradient>
    <linearGradient id="hotelFacade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2d2ba"/>
      <stop offset="100%" stop-color="#ba9f83"/>
    </linearGradient>
    <filter id="hotelGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Night Sky -->
  <rect width="400" height="480" fill="url(#nightSky)"/>

  <!-- Stars / Distant Lights -->
  <circle cx="80" cy="50" r="1.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="140" cy="30" r="1" fill="#ffffff" opacity="0.6"/>
  <circle cx="320" cy="45" r="1.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="280" cy="20" r="1" fill="#ffffff" opacity="0.5"/>

  <!-- Hotel Building -->
  <g transform="translate(60, 60)">
    <!-- Rooftop Sign Box -->
    <rect x="50" y="0" width="180" height="42" rx="4" fill="#0f172a" stroke="#d97706" stroke-width="1.5"/>
    <text x="140" y="27" font-family="'Roboto', 'Inter', -apple-system, sans-serif" font-size="18" font-weight="900" fill="#fef08a" letter-spacing="6" text-anchor="middle" filter="url(#hotelGlow)">HOTEL</text>
    
    <!-- Main Building Block -->
    <rect x="15" y="40" width="250" height="340" rx="3" fill="url(#hotelFacade)"/>
    <rect x="10" y="38" width="260" height="8" fill="#8c6d50"/>

    <!-- Grid of Windows -->
    <!-- Floor 1 -->
    <g transform="translate(30, 60)">
      <rect x="0" y="0" width="34" height="42" rx="2" fill="#fef08a"/>
      <rect x="54" y="0" width="34" height="42" rx="2" fill="#1e293b"/>
      <rect x="108" y="0" width="34" height="42" rx="2" fill="#fde047"/>
      <rect x="162" y="0" width="34" height="42" rx="2" fill="#1e293b"/>
    </g>

    <!-- Floor 2 -->
    <g transform="translate(30, 120)">
      <rect x="0" y="0" width="34" height="42" rx="2" fill="#1e293b"/>
      <rect x="54" y="0" width="34" height="42" rx="2" fill="#fef08a"/>
      <rect x="108" y="0" width="34" height="42" rx="2" fill="#1e293b"/>
      <rect x="162" y="0" width="34" height="42" rx="2" fill="#fde047"/>
    </g>

    <!-- Floor 3 -->
    <g transform="translate(30, 180)">
      <rect x="0" y="0" width="34" height="42" rx="2" fill="#fde047"/>
      <rect x="54" y="0" width="34" height="42" rx="2" fill="#1e293b"/>
      <rect x="108" y="0" width="34" height="42" rx="2" fill="#fef08a"/>
      <rect x="162" y="0" width="34" height="42" rx="2" fill="#1e293b"/>
    </g>

    <!-- Floor 4 -->
    <g transform="translate(30, 240)">
      <rect x="0" y="0" width="34" height="42" rx="2" fill="#1e293b"/>
      <rect x="54" y="0" width="34" height="42" rx="2" fill="#fde047"/>
      <rect x="108" y="0" width="34" height="42" rx="2" fill="#1e293b"/>
      <rect x="162" y="0" width="34" height="42" rx="2" fill="#fef08a"/>
    </g>
  </g>

  <!-- Ground Landscape & Palm Silhouettes -->
  <path d="M0 430 Q120 410 240 425 T400 415 L400 480 L0 480 Z" fill="#0d1b2a"/>
  
  <!-- Silhouette Plants on Sides -->
  <g fill="#0b1320" opacity="0.9">
    <!-- Left Bush -->
    <circle cx="30" cy="450" r="35"/>
    <circle cx="70" cy="460" r="28"/>
    <!-- Right Palm Fronds -->
    <path d="M360 480 Q340 410 300 390 Q330 420 350 480 Z"/>
    <path d="M370 480 Q370 400 395 380 Q380 420 375 480 Z"/>
  </g>
</svg>

