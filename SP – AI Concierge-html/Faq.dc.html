<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Bellhop AI Concierge – FAQ</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
<link rel="stylesheet" href="./assets/81e26d43a82c22dd79010c853e0d4ffa.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="bh {{markCls}}" style="background: transparent">
<div class="split-48">
  <div class="stack" style="gap: 20px">
    <span class="eyebrow">FAQ</span>
    <h2 class="h2">{{title}}</h2>
    <div class="stack" style="gap: 14px; margin-top: 12px; padding: 24px; border-radius: 18px; background: #fff; border: 1px solid #dde4ec">
      <div class="row" style="gap: 12px"><span class="ic ic-tile-sm i-headset"></span><b style="color: #122745">Chưa thấy câu trả lời?</b></div>
      <p class="small muted">Đội Bellhop sẵn sàng giải đáp qua Zalo hoặc điện thoại.</p>
      <div class="btns"><a class="btn btn-sm" href="#" style="background: #0068ff; color: #fff">Chat Zalo</a><a class="btn btn-sm btn-outline" href="#">Gọi <span class="ph">[hotline]</span></a></div>
    </div>
  </div>
  <div class="faq">
    <sc-for list="{{rows}}" as="it" hint-placeholder-count="5">
    <div class="faq-i {{it.cls}}">
      <button class="faq-q" aria-expanded="{{it.exp}}" onClick="{{it.toggle}}"><span>{{it.q}}</span><span class="pm" aria-hidden="true"></span></button>
      <sc-if value="{{it.open}}" hint-placeholder-val="{{ false }}">
        <div class="faq-a">{{it.a}} <sc-if value="{{it.tbc}}" hint-placeholder-val="{{ false }}"><i class="tbc">Cần xác nhận</i></sc-if></div>
      </sc-if>
    </div>
    </sc-for>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"title":{"editor":"text","default":"Câu hỏi thường gặp"},"marks":{"editor":"boolean","default":true},"items":{"editor":null},"$preview":{"width":1440,"height":760}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: 0 }; }
  renderVals() {
    const items = this.props.items || [
      { q: 'AI có trả lời sai hoặc tự đưa ra thông tin không có thật không?', a: 'AI được thiết lập để trả lời trong phạm vi cơ sở kiến thức do khách sạn kiểm soát; các câu hỏi nằm ngoài phạm vi sẽ tự động chuyển cho nhân viên xử lý.', tbc: true },
      { q: 'AI Concierge hỗ trợ những ngôn ngữ nào?', a: 'AI Concierge hỗ trợ đa ngôn ngữ bao gồm Tiếng Việt, Tiếng Anh và nhiều ngôn ngữ quốc tế khác theo nhu cầu của khách sạn.', tbc: true },
      { q: 'Có thể xem lại các cuộc trò chuyện của AI không?', a: 'Có. Khách sạn có thể xem lại toàn bộ lịch sử hội thoại của AI với khách hàng bất kỳ lúc nào để đánh giá và cải thiện chất lượng hỗ trợ.', tbc: true },
      { q: 'AI có thể tự xác nhận hoặc hủy đặt phòng không?', a: 'Các thao tác thay đổi hoặc hủy phòng được chuyển sang cho nhân viên để đảm bảo tính an toàn và kiểm soát chính xác nghiệp vụ.', tbc: true },
      { q: 'Có cần dùng Bellhop Message không?', a: 'AI Concierge có thể hoạt động độc lập trên Live chat website, hoặc kết hợp với Bellhop Message để hỗ trợ thêm Zalo OA, Messenger và các kênh khác.', tbc: true }
    ];
    const o = this.state.open;
    const marks = this.props.marks ?? true;
    return {
      markCls: marks ? '' : 'no-marks',
      title: this.props.title ?? 'Câu hỏi thường gặp',
      rows: items.map((it, i) => ({
        q: it.q, a: it.a, tbc: !!it.tbc,
        open: o === i, cls: o === i ? 'open' : '', exp: o === i ? 'true' : 'false',
        toggle: () => this.setState({ open: this.state.open === i ? -1 : i })
      }))
    };
  }
}
</script>
</body>
</html>
