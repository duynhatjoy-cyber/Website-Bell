<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" width="100%" height="100%">
  <defs>
    <linearGradient id="resortSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a9fc2"/>
      <stop offset="50%" stop-color="#6ec6dc"/>
      <stop offset="100%" stop-color="#a8e4ec"/>
    </linearGradient>
    <linearGradient id="seaWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e7b99"/>
      <stop offset="100%" stop-color="#0b3d52"/>
    </linearGradient>
    <linearGradient id="overlayTeal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(11,30,48,0)"/>
      <stop offset="55%" stop-color="rgba(11,30,48,0.3)"/>
      <stop offset="100%" stop-color="rgba(11,30,48,0.92)"/>
    </linearGradient>
    <filter id="btnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#14b8a6" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Bầu trời biển trong lành -->
  <rect width="520" height="280" fill="url(#resortSky)"/>

  <!-- Mặt biển xanh biếc phía trước -->
  <rect x="0" y="170" width="520" height="110" fill="url(#seaWater)"/>
  <path d="M0 185 Q130 180 260 185 T520 185" fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.5"/>
  <path d="M0 205 Q140 200 280 205 T520 205" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.3"/>

  <!-- Đồi xanh / sườn đồi phía sau -->
  <path d="M0 180 Q140 145 280 160 T520 150 L520 280 L0 280 Z" fill="#2d6a4f" opacity="0.85"/>
  <path d="M0 190 Q150 165 300 178 T520 170 L520 280 L0 280 Z" fill="#1b4332"/>

  <!-- Biệt thự hiện đại Hillside Villa 2 tầng -->
  <g id="villa-architecture" transform="translate(145, 45)">
    <!-- Tầng trệt -->
    <rect x="0" y="70" width="230" height="85" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <rect x="18" y="82" width="105" height="70" rx="2" fill="#0284c7" opacity="0.8"/>
    <line x1="70" y1="82" x2="70" y2="152" stroke="#38bdf8" stroke-width="2"/>
    <rect x="135" y="82" width="75" height="70" rx="2" fill="#f1f5f9"/>
    <rect x="145" y="92" width="55" height="60" fill="#0f172a" rx="1"/>

    <!-- Tầng 2 nhô ra phong cách tối giản -->
    <rect x="45" y="15" width="165" height="60" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="60" y="24" width="60" height="42" rx="2" fill="#38bdf8" opacity="0.75"/>
    <rect x="130" y="24" width="60" height="42" rx="2" fill="#38bdf8" opacity="0.75"/>

    <!-- Mái bằng vát nhô hiện đại -->
    <rect x="35" y="10" width="185" height="6" rx="2" fill="#334155"/>
    <rect x="-10" y="66" width="250" height="6" rx="2" fill="#475569"/>
  </g>

  <!-- Cây dừa bên trái vươn lên duyên dáng -->
  <g transform="translate(45, 230)">
    <path d="M10 0 Q-5 -70 20 -130" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(20, -130)">
      <path d="M0 0 Q-30 -20 -50 0" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M0 0 Q-20 -40 -35 -40" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M0 0 Q20 -40 35 -30" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M0 0 Q35 -15 50 5" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M0 0 Q10 25 30 35" fill="none" stroke="#059669" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Cây dừa bên phải -->
  <g transform="translate(470, 220)">
    <path d="M10 0 Q25 -65 0 -120" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(0, -120)">
      <path d="M0 0 Q-30 -30 -45 -15" fill="none" stroke="#047857" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M0 0 Q-10 -45 10 -45" fill="none" stroke="#047857" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M0 0 Q30 -25 45 -10" fill="none" stroke="#047857" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M0 0 Q25 15 35 30" fill="none" stroke="#047857" stroke-width="3.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Lớp phủ bóng gradient để text và nút bấm nổi bật -->
  <rect width="520" height="280" fill="url(#overlayTeal)"/>

  <!-- Text chân ảnh: Hillside Villa / Còn 2 căn cho 23–25/10 -->
  <g transform="translate(32, 222)">
    <text x="0" y="16" fill="#ffffff" font-family="-apple-system, Roboto, sans-serif" font-size="20" font-weight="800">Hillside Villa</text>
    <text x="0" y="38" fill="#99f6e4" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="600">Còn 2 căn cho 23–25/10</text>
  </g>

  <!-- Nút Đặt ngay góc dưới bên phải -->
  <g transform="translate(390, 220)" filter="url(#btnGlow)">
    <rect width="98" height="38" rx="10" fill="#14b8a6"/>
    <text x="49" y="24" fill="#ffffff" font-family="-apple-system, Roboto, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Đặt ngay</text>
  </g>
</svg>

