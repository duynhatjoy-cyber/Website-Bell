<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%">
  <defs>
    <!-- Multi-stage realistic shadow for layered 3D depth -->
    <filter id="shadowDeep" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#071324" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#071324" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowSide" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#071324" flood-opacity="0.16"/>
    </filter>

    <!-- Gradients for realistic website previews -->
    <linearGradient id="hotelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="resortGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="60%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#021c1b"/>
    </linearGradient>

    <linearGradient id="dalatSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d5272"/>
      <stop offset="50%" stop-color="#467399"/>
      <stop offset="85%" stop-color="#7da1bf"/>
      <stop offset="100%" stop-color="#e2edf5"/>
    </linearGradient>

    <linearGradient id="tealBtnGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f7a84"/>
      <stop offset="100%" stop-color="#5fb9c2"/>
    </linearGradient>
  </defs>

  <!-- ================= CARD 1: LEFT (Boutique Hotel) ================= -->
  <g filter="url(#shadowSide)" transform="translate(30, 65)">
    <!-- Browser Frame -->
    <rect width="330" height="440" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Browser Top Bar -->
    <rect width="330" height="34" rx="16" fill="#f1f5f9"/>
    <rect y="18" width="330" height="16" fill="#f1f5f9"/>
    <circle cx="22" cy="17" r="4.5" fill="#94a3b8"/>
    <circle cx="36" cy="17" r="4.5" fill="#94a3b8"/>
    <circle cx="50" cy="17" r="4.5" fill="#94a3b8"/>
    <rect x="75" y="8" width="180" height="18" rx="5" fill="#e2e8f0"/>
    <text x="92" y="21" font-family="'Roboto', sans-serif" font-size="9" fill="#64748b">grandboutique-hotel.vn</text>

    <!-- Hero Visual Area -->
    <rect y="34" width="330" height="210" fill="url(#hotelGrad)"/>
    <!-- Subtle hotel architectural lines -->
    <rect x="25" y="55" width="280" height="1" fill="#ffffff" opacity="0.12"/>
    <text x="28" y="105" font-family="'Roboto', sans-serif" font-size="22" fill="#ffffff" font-weight="900" letter-spacing="-0.01em">The Grand Boutique</text>
    <text x="28" y="130" font-family="'Roboto', sans-serif" font-size="12" fill="#94a3b8">Khách sạn 4 sao phố cổ · Hà Nội</text>
    
    <rect x="28" y="152" width="110" height="34" rx="8" fill="#5fb9c2"/>
    <text x="46" y="174" font-family="'Roboto', sans-serif" font-size="12" fill="#0f172a" font-weight="800">Đặt phòng trực tiếp</text>

    <!-- Sub content preview -->
    <rect x="28" y="265" width="130" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="36" y="275" width="114" height="40" rx="4" fill="#334155"/>
    <text x="36" y="332" font-family="'Roboto', sans-serif" font-size="11" fill="#0f172a" font-weight="700">Deluxe City View</text>

    <rect x="172" y="265" width="130" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="180" y="275" width="114" height="40" rx="4" fill="#475569"/>
    <text x="180" y="332" font-family="'Roboto', sans-serif" font-size="11" fill="#0f172a" font-weight="700">Executive Suite</text>

    <rect x="28" y="365" width="274" height="48" rx="8" fill="#f1f5f9"/>
    <text x="44" y="394" font-family="'Roboto', sans-serif" font-size="11" fill="#64748b">⭐ Đánh giá 9.4/10 trên mọi nền tảng</text>
  </g>

  <!-- ================= CARD 2: RIGHT (Eco Villa & Resort) ================= -->
  <g filter="url(#shadowSide)" transform="translate(560, 65)">
    <!-- Browser Frame -->
    <rect width="330" height="440" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Browser Top Bar -->
    <rect width="330" height="34" rx="16" fill="#f1f5f9"/>
    <rect y="18" width="330" height="16" fill="#f1f5f9"/>
    <circle cx="22" cy="17" r="4.5" fill="#94a3b8"/>
    <circle cx="36" cy="17" r="4.5" fill="#94a3b8"/>
    <circle cx="50" cy="17" r="4.5" fill="#94a3b8"/>
    <rect x="75" y="8" width="180" height="18" rx="5" fill="#e2e8f0"/>
    <text x="92" y="21" font-family="'Roboto', sans-serif" font-size="9" fill="#64748b">greenvalley-resort.vn</text>

    <!-- Hero Visual Area -->
    <rect y="34" width="330" height="210" fill="url(#resortGrad)"/>
    <text x="28" y="105" font-family="'Roboto', sans-serif" font-size="22" fill="#ffffff" font-weight="900" letter-spacing="-0.01em">Green Valley Resort</text>
    <text x="28" y="130" font-family="'Roboto', sans-serif" font-size="12" fill="#a7f3d0">Khu nghỉ dưỡng sinh thái &amp; Villa riêng tư</text>
    
    <rect x="28" y="152" width="118" height="34" rx="8" fill="#ffffff"/>
    <text x="42" y="174" font-family="'Roboto', sans-serif" font-size="12" fill="#042f2e" font-weight="800">Đặt nguyên căn →</text>

    <!-- Sub content preview -->
    <rect x="28" y="265" width="130" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="36" y="275" width="114" height="40" rx="4" fill="#0d9488"/>
    <text x="36" y="332" font-family="'Roboto', sans-serif" font-size="11" fill="#0f172a" font-weight="700">Villa 2 Phòng ngủ</text>

    <rect x="172" y="265" width="130" height="80" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <rect x="180" y="275" width="114" height="40" rx="4" fill="#14b8a6"/>
    <text x="180" y="332" font-family="'Roboto', sans-serif" font-size="11" fill="#0f172a" font-weight="700">Bungalow ven suối</text>

    <rect x="28" y="365" width="274" height="48" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="44" y="394" font-family="'Roboto', sans-serif" font-size="11" fill="#166534" font-weight="600">🌿 Ưu đãi đặt sớm: Giảm 15% mùa hè</text>
  </g>

  <!-- ================= CARD 3: CENTER FRONT (Mây Homestay Đà Lạt) ================= -->
  <g filter="url(#shadowDeep)" transform="translate(235, 18)">
    <!-- Browser Frame -->
    <rect width="450" height="524" rx="18" fill="#ffffff" stroke="#0f172a" stroke-width="2.5"/>

    <!-- Browser macOS Header (Dark Theme) -->
    <rect width="450" height="40" rx="18" fill="#0f172a"/>
    <rect y="22" width="450" height="18" fill="#0f172a"/>
    <circle cx="26" cy="20" r="6" fill="#ef4444"/>
    <circle cx="44" cy="20" r="6" fill="#f59e0b"/>
    <circle cx="62" cy="20" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="95" y="8" width="260" height="24" rx="7" fill="#ffffff" fill-opacity="0.14"/>
    <text x="135" y="24" font-family="'Roboto', sans-serif" font-size="11" fill="#f8fafc">homestay-dalat.bellhop.vn</text>

    <!-- Hero Image Area: Pine Trees & Mountain Twilight -->
    <g transform="translate(0, 40)">
      <rect width="450" height="240" fill="url(#dalatSky)"/>
      
      <!-- Mountain Silhouettes -->
      <path d="M0 160 Q110 110 225 145 T450 130 L450 240 L0 240 Z" fill="#24445c" opacity="0.65"/>
      <path d="M0 185 Q140 140 280 175 T450 165 L450 240 L0 240 Z" fill="#183244"/>

      <!-- Pine tree silhouettes -->
      <g fill="#0e202c">
        <polygon points="40,200 48,165 56,200"/>
        <polygon points="65,205 73,155 81,205"/>
        <polygon points="85,210 92,170 99,210"/>
        <polygon points="360,205 368,160 376,205"/>
        <polygon points="385,200 393,150 401,200"/>
        <polygon points="410,210 417,165 424,210"/>
      </g>

      <!-- Homestay Title & Slogan -->
      <text x="36" y="90" font-family="'Roboto', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="-0.02em">Mây Homestay Đà Lạt</text>
      <text x="36" y="118" font-family="'Roboto', sans-serif" font-size="14.5" fill="#f1f5f9" font-weight="500">Chốn dừng chân ấm cúng giữa ngàn thông</text>

      <!-- Integrated Direct Booking Engine Bar -->
      <g transform="translate(30, 160)">
        <rect width="390" height="60" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadowSide)"/>
        
        <!-- Date & Guest info -->
        <g transform="translate(20, 18)">
          <text x="0" y="12" font-family="'Roboto', sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="0.08em">NGÀY ĐẾN – NGÀY ĐI</text>
          <text x="0" y="28" font-family="'Roboto', sans-serif" font-size="13.5" font-weight="800" fill="#0f172a">23/10 – 25/10 · 2 Khách</text>
        </g>
        
        <!-- Divider -->
        <line x1="225" y1="12" x2="225" y2="48" stroke="#e2e8f0" stroke-width="1"/>

        <!-- Booking CTA Button -->
        <rect x="250" y="10" width="125" height="40" rx="8" fill="url(#tealBtnGrad)"/>
        <text x="312" y="35" font-family="'Roboto', sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">Đặt phòng</text>
      </g>
    </g>

    <!-- Lower Content: Featured Room Cards -->
    <g transform="translate(0, 340)">
      <text x="36" y="24" font-family="'Roboto', sans-serif" font-size="16" font-weight="800" fill="#0f172a">Hạng phòng nổi bật</text>
      
      <!-- Room Card 1 -->
      <g transform="translate(30, 36)">
        <rect width="186" height="124" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
        <rect width="186" height="66" rx="10" fill="#5fb9c2"/>
        <rect y="56" width="186" height="10" fill="#5fb9c2"/>
        <!-- Room Tag -->
        <rect x="8" y="8" width="60" height="18" rx="4" fill="#ffffff" fill-opacity="0.9"/>
        <text x="14" y="21" font-family="'Roboto', sans-serif" font-size="9" font-weight="800" fill="#122745">View đồi</text>
        <!-- Room Info -->
        <text x="12" y="86" font-family="'Roboto', sans-serif" font-size="12" font-weight="800" fill="#0f172a">Phòng View Thung Lũng</text>
        <text x="12" y="102" font-family="'Roboto', sans-serif" font-size="10" fill="#64748b">25m² · Giường đôi lớn</text>
        <text x="12" y="118" font-family="'Roboto', sans-serif" font-size="13" font-weight="900" fill="#1f7a84">650.000đ<tspan font-size="9.5" font-weight="500" fill="#64748b">/đêm</tspan></text>
      </g>

      <!-- Room Card 2 -->
      <g transform="translate(234, 36)">
        <rect width="186" height="124" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
        <rect width="186" height="66" rx="10" fill="#122745"/>
        <rect y="56" width="186" height="10" fill="#122745"/>
        <!-- Room Tag -->
        <rect x="8" y="8" width="65" height="18" rx="4" fill="#ffffff" fill-opacity="0.9"/>
        <text x="14" y="21" font-family="'Roboto', sans-serif" font-size="9" font-weight="800" fill="#122745">Gỗ thông</text>
        <!-- Room Info -->
        <text x="12" y="86" font-family="'Roboto', sans-serif" font-size="12" font-weight="800" fill="#0f172a">Phòng Áp Mái Gỗ</text>
        <text x="12" y="102" font-family="'Roboto', sans-serif" font-size="10" fill="#64748b">32m² · Bồn tắm view rừng</text>
        <text x="12" y="118" font-family="'Roboto', sans-serif" font-size="13" font-weight="900" fill="#1f7a84">850.000đ<tspan font-size="9.5" font-weight="500" fill="#64748b">/đêm</tspan></text>
      </g>
    </g>
  </g>
</svg>
