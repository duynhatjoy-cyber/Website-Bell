<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <!-- Depth drop shadows for realistic 3D cascading layers -->
    <filter id="shadowBack" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0b1b30" flood-opacity="0.16"/>
    </filter>
    <filter id="shadowMid" x="-15%" y="-15%" width="135%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0b1b30" flood-opacity="0.22"/>
    </filter>
    <filter id="shadowFront" x="-15%" y="-15%" width="140%" height="145%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#071324" flood-opacity="0.26"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#071324" flood-opacity="0.12"/>
    </filter>

    <clipPath id="cardClip1">
      <rect width="560" height="360" rx="18"/>
    </clipPath>
    <clipPath id="cardClip2">
      <rect width="560" height="360" rx="18"/>
    </clipPath>
    <clipPath id="cardClip3">
      <rect width="560" height="370" rx="18"/>
    </clipPath>
  </defs>

  <!-- ================= CARD 1: BACK (Slate Blue - Khách sạn - Mẫu A) ================= -->
  <g filter="url(#shadowBack)" transform="translate(30, 20)">
    <g clip-path="url(#cardClip1)">
      <!-- Card Body Background -->
      <rect width="560" height="360" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

      <!-- Header: Slate Blue (#3a607f) -->
      <rect width="560" height="155" fill="#3a607f"/>

      <!-- Browser Top Pill with 3 dots -->
      <rect x="28" y="22" width="50" height="22" rx="6" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="40" cy="33" r="2.5" fill="#94a3b8"/>
      <circle cx="53" cy="33" r="2.5" fill="#94a3b8"/>
      <circle cx="66" cy="33" r="2.5" fill="#94a3b8"/>

      <!-- Title & Badge completely within visible stripe (0 - 155px) -->
      <text x="28" y="96" font-family="'Roboto', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">Khách sạn</text>
      <rect x="28" y="110" width="76" height="24" rx="6" fill="#ffffff" fill-opacity="0.22"/>
      <text x="38" y="127" font-family="'Roboto', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Mẫu A</text>

      <!-- Body Content Placeholders within visible stripe -->
      <g transform="translate(28, 180)">
        <rect width="118" height="68" rx="8" fill="#eef2f6"/>
        <rect x="10" y="38" width="50" height="8" rx="4" fill="#94a3b8"/>
        <rect x="10" y="52" width="70" height="6" rx="3" fill="#cbd5e1"/>

        <rect y="84" width="118" height="32" rx="7" fill="none" stroke="#cbd5e1" stroke-width="1.6"/>
        <text x="59" y="105" text-anchor="middle" font-family="'Roboto', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">Xem phòng</text>
      </g>
    </g>
    <!-- Border overlay for crisp corners -->
    <rect width="560" height="360" rx="18" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>

  <!-- ================= CARD 2: MIDDLE (Teal - Homestay - Mẫu B) ================= -->
  <g filter="url(#shadowMid)" transform="translate(185, 85)">
    <g clip-path="url(#cardClip2)">
      <!-- Card Body Background -->
      <rect width="560" height="360" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

      <!-- Header: Teal (#2ba397) -->
      <rect width="560" height="155" fill="#2ba397"/>

      <!-- Browser Top Pill with 3 dots -->
      <rect x="28" y="22" width="50" height="22" rx="6" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="40" cy="33" r="2.5" fill="#94a3b8"/>
      <circle cx="53" cy="33" r="2.5" fill="#94a3b8"/>
      <circle cx="66" cy="33" r="2.5" fill="#94a3b8"/>

      <!-- Title & Badge completely within visible stripe (0 - 165px) -->
      <text x="28" y="96" font-family="'Roboto', system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">Homestay</text>
      <rect x="28" y="110" width="76" height="24" rx="6" fill="#ffffff" fill-opacity="0.22"/>
      <text x="38" y="127" font-family="'Roboto', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Mẫu B</text>

      <!-- Body Content Placeholders within visible stripe -->
      <g transform="translate(28, 180)">
        <rect width="128" height="68" rx="8" fill="#eef2f6"/>
        <rect x="10" y="38" width="56" height="8" rx="4" fill="#94a3b8"/>
        <rect x="10" y="52" width="80" height="6" rx="3" fill="#cbd5e1"/>

        <rect y="84" width="128" height="32" rx="7" fill="none" stroke="#cbd5e1" stroke-width="1.6"/>
        <text x="64" y="105" text-anchor="middle" font-family="'Roboto', system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" fill="#64748b">Nguyên căn</text>
      </g>
    </g>
    <!-- Border overlay for crisp corners -->
    <rect width="560" height="360" rx="18" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  </g>

  <!-- ================= CARD 3: FRONT (Deep Navy - Chuỗi - Mẫu C) ================= -->
  <g filter="url(#shadowFront)" transform="translate(350, 150)">
    <g clip-path="url(#cardClip3)">
      <!-- Card Body Background -->
      <rect width="560" height="370" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

      <!-- Header: Deep Bellhop Navy (#0d1e38) -->
      <rect width="560" height="155" fill="#0d1e38"/>

      <!-- Browser Top Pill with 3 dots -->
      <rect x="28" y="22" width="50" height="22" rx="6" fill="#ffffff" fill-opacity="0.95"/>
      <circle cx="40" cy="33" r="2.5" fill="#94a3b8"/>
      <circle cx="53" cy="33" r="2.5" fill="#94a3b8"/>
      <circle cx="66" cy="33" r="2.5" fill="#94a3b8"/>

      <!-- Direct Booking Badge on top right -->
      <rect x="376" y="20" width="156" height="26" rx="13" fill="#2ba397"/>
      <circle cx="392" cy="33" r="3.5" fill="#ffffff"/>
      <text x="404" y="38" font-family="'Roboto', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Đặt phòng trực tiếp</text>

      <!-- Title & Tagline -->
      <text x="28" y="94" font-family="'Roboto', system-ui, -apple-system, sans-serif" font-size="25" font-weight="800" fill="#ffffff" letter-spacing="-0.01em">Chuỗi lưu trú - Mẫu C</text>
      <text x="28" y="122" font-family="'Roboto', system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="500" fill="#94a3b8">Giao diện đa chi nhánh, đồng bộ tồn phòng &amp; giá tức thì</text>

      <!-- Body Content: 3 Room Cards -->
      <g transform="translate(24, 175)">
        <!-- Room 1 -->
        <g transform="translate(0, 0)">
          <rect width="158" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <rect width="158" height="52" rx="8" fill="#e2e8f0"/>
          <rect x="8" y="62" width="100" height="8" rx="4" fill="#0f172a"/>
          <rect x="8" y="76" width="60" height="7" rx="3.5" fill="#14b8a6"/>
        </g>
        <!-- Room 2 -->
        <g transform="translate(176, 0)">
          <rect width="158" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <rect width="158" height="52" rx="8" fill="#dbeafe"/>
          <rect x="8" y="62" width="110" height="8" rx="4" fill="#0f172a"/>
          <rect x="8" y="76" width="64" height="7" rx="3.5" fill="#14b8a6"/>
        </g>
        <!-- Room 3 -->
        <g transform="translate(352, 0)">
          <rect width="160" height="100" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
          <rect width="160" height="52" rx="8" fill="#ccfbf1"/>
          <rect x="8" y="62" width="105" height="8" rx="4" fill="#0f172a"/>
          <rect x="8" y="76" width="62" height="7" rx="3.5" fill="#14b8a6"/>
        </g>
      </g>

      <!-- Bottom Search Bar -->
      <g transform="translate(24, 296)">
        <rect width="512" height="50" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
        <!-- Search icon -->
        <circle cx="28" cy="25" r="5.5" fill="none" stroke="#64748b" stroke-width="1.8"/>
        <line x1="32" y1="29" x2="39" y2="36" stroke="#64748b" stroke-width="1.8" stroke-linecap="round"/>
        <text x="48" y="30" font-family="'Roboto', system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b">Tìm theo điểm đến, ngày nhận phòng…</text>

        <!-- Search button -->
        <rect x="408" y="7" width="96" height="36" rx="7" fill="#0d1e38"/>
        <text x="456" y="29" text-anchor="middle" font-family="'Roboto', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#ffffff">Tìm phòng</text>
      </g>
    </g>
    <!-- Crisp outline -->
    <rect width="560" height="370" rx="18" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
  </g>
</svg>
