<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sunsetSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#16222f"/>
      <stop offset="40%" stop-color="#2a3a47"/>
      <stop offset="75%" stop-color="#735e53"/>
      <stop offset="100%" stop-color="#cca885"/>
    </linearGradient>
    <linearGradient id="cardDarkOverlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(11,26,43,0.88)"/>
      <stop offset="55%" stop-color="rgba(11,26,43,0.65)"/>
      <stop offset="100%" stop-color="rgba(11,26,43,0.2)"/>
    </linearGradient>
  </defs>

  <!-- Bầu trời hoàng hôn -->
  <rect width="680" height="400" fill="url(#sunsetSky)"/>

  <!-- Vầng mặt trời dịu dàng góc trên bên phải -->
  <circle cx="510" cy="115" r="46" fill="#fef08a" opacity="0.85"/>
  <circle cx="510" cy="115" r="54" fill="#fef08a" opacity="0.25"/>

  <!-- Dãy núi phía xa -->
  <path d="M0 240 L160 160 L330 225 L490 145 L680 230 L680 400 L0 400 Z" fill="#202c38" opacity="0.9"/>
  <path d="M120 230 L270 140 L450 215 L580 165 L680 210 L680 400 L120 400 Z" fill="#2d3b48" opacity="0.8"/>

  <!-- Đồi trước và ngôi nhà villa mái dốc -->
  <path d="M180 400 L180 310 Q320 270 480 295 Q590 310 680 280 L680 400 Z" fill="#314238"/>

  <!-- Căn nhà Hillside Villa ở giữa -->
  <g id="hillside-house" transform="translate(260, 240)">
    <!-- Thân nhà -->
    <rect x="0" y="45" width="165" height="75" fill="#cfc6ba" rx="2"/>
    <!-- Mái nhà dốc -->
    <polygon points="-10,48 82,10 175,48" fill="#3b2b20"/>
    <polygon points="-4,48 82,14 169,48" fill="#4d392b"/>
    <!-- 2 Cửa sổ sáng đèn vàng -->
    <rect x="25" y="65" width="38" height="34" fill="#66533c" rx="2"/>
    <rect x="100" y="65" width="38" height="34" fill="#66533c" rx="2"/>
  </g>

  <!-- Rặng thông xanh mướt phía trước -->
  <g fill="#1a2e24">
    <!-- Cụm thông trái -->
    <polygon points="25,400 35,360 45,400"/>
    <polygon points="40,400 55,345 70,400"/>
    <polygon points="65,400 80,355 95,400"/>
    <polygon points="90,400 105,335 120,400"/>
    <polygon points="115,400 130,350 145,400"/>
    <polygon points="140,400 155,365 170,400"/>
    <polygon points="165,400 180,340 195,400"/>
    <polygon points="190,400 205,360 220,400"/>
    
    <!-- Cụm thông phải chân đồi -->
    <polygon points="460,400 475,365 490,400"/>
    <polygon points="485,400 500,350 515,400"/>
    <polygon points="510,400 525,360 540,400"/>
    <polygon points="610,400 625,345 640,400"/>
    <polygon points="635,400 650,335 665,400"/>
    <polygon points="660,400 670,355 680,400"/>
  </g>

  <!-- Lớp gradient tối bên trái để text bên trái luôn cực kỳ sắc nét và dễ đọc -->
  <rect width="680" height="400" fill="url(#cardDarkOverlay)"/>
</svg>

